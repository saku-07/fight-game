<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Firebase Online Test</title>
<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#111;
  color:white;
}
button{
  font-size:20px;
  padding:12px 20px;
  margin:10px;
}
</style>
</head>

<body>

<h1>オンラインテスト</h1>

<button id="create">ルーム作成</button>

<p id="status">Firebase接続中...</p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkY-kHndDPPZjqr7F52oPyvg5gAJs3Ipk",
  authDomain: "fight-game-5abcb.firebaseapp.com",
  databaseURL: "https://fight-game-5abcb-default-rtdb.firebaseio.com",
  projectId: "fight-game-5abcb",
  storageBucket: "fight-game-5abcb.firebasestorage.app",
  messagingSenderId: "875972972511",
  appId: "1:875972972511:web:c78d67bcd5a31010f1be6a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const status = document.getElementById("status");
const createBtn = document.getElementById("create");

createBtn.disabled = true;

signInAnonymously(auth)
.then(()=>{
  status.innerText="Firebase接続成功";
  createBtn.disabled=false;
})
.catch((e)=>{
  status.innerText="Firebaseログイン失敗";
  console.error(e);
});

function randomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";
  for(let i=0;i<6;i++){
    code+=chars[Math.floor(Math.random()*chars.length)];
  }
  return code;
}

createBtn.onclick=async ()=>{

  const room=randomCode();

  await set(ref(db,"rooms/"+room),{
    created:Date.now()
  });

  status.innerText="ルーム作成成功 : "+room;

};

</script>

</body>
</html>
