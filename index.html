<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Fight Game Engine Advanced</title>
  <style>
    :root{
      --bg1:#090d18;
      --bg2:#17213a;
      --panel:rgba(7,10,18,.82);
      --line:rgba(255,255,255,.12);
      --text:#eef3ff;
      --muted:#aab6d5;
      --accent:#ff596c;
      --accent2:#5fb0ff;
      --accent3:#ffd24d;
      --good:#49d68b;
      --shadow:0 18px 50px rgba(0,0,0,.45);
    }
    *{
      box-sizing:border-box;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent;
    }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:linear-gradient(180deg,var(--bg2),var(--bg1));
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      touch-action:none;
      overscroll-behavior:none;
    }
    body{
      position:fixed;
      inset:0;
    }
    #app{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }
    canvas{
      display:none;
      width:100vw;
      height:100vh;
      background:#0b1020;
    }
    .screen{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.06), transparent 35%),
        linear-gradient(180deg, rgba(17,25,45,.96), rgba(0,0,0,.96));
      z-index:20;
    }
    .screen.show{ display:flex; }
    .panel{
      width:min(94vw,840px);
      max-height:92vh;
      overflow:auto;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      padding:24px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      text-align:center;
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(34px,6vw,62px);
      letter-spacing:.08em;
    }
    h2{
      margin:0 0 16px;
      font-size:clamp(24px,4vw,38px);
    }
    p{
      margin:8px 0;
      color:var(--muted);
      line-height:1.7;
    }
    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:12px;
    }
    .stack{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
    }
    button,select{
      border:none;
      outline:none;
      border-radius:16px;
      color:#fff;
      font-size:18px;
      font-weight:800;
      min-width:220px;
      padding:16px 20px;
      box-shadow:var(--shadow);
    }
    button{
      background:linear-gradient(180deg,#ff6677,#c92f46);
      cursor:pointer;
    }
    button.secondary{
      background:linear-gradient(180deg,#62718f,#33405a);
    }
    button.green{
      background:linear-gradient(180deg,#59de93,#22975d);
    }
    select{
      appearance:none;
      background:linear-gradient(180deg,#25324d,#182235);
    }
    .sub{
      font-size:13px;
      color:var(--muted);
      margin-bottom:18px;
    }
    .pick-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin-top:14px;
    }
    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:20px;
      padding:14px;
      text-align:left;
      cursor:pointer;
      transition:transform .15s ease, border-color .15s ease;
    }
    .card:hover{ transform:translateY(-2px); }
    .card.active{
      border-color:rgba(255,255,255,.35);
      box-shadow:0 0 0 2px rgba(255,255,255,.08) inset;
    }
    .card h3{
      margin:0 0 8px;
      font-size:18px;
    }
    .card p{
      margin:4px 0;
      font-size:13px;
    }
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      font-size:11px;
      font-weight:700;
      margin-right:6px;
      margin-top:6px;
    }

    #hud{
      position:absolute;
      inset:0;
      display:none;
      z-index:5;
      pointer-events:none;
    }
    .top-ui{
      position:absolute;
      left:0;
      top:0;
      width:100%;
      padding:14px 16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }
    .fighter-panel{
      width:min(38vw,360px);
      background:rgba(0,0,0,.34);
      border:1px solid var(--line);
      border-radius:18px;
      padding:10px 12px;
      backdrop-filter:blur(6px);
    }
    .fighter-name{
      font-size:14px;
      font-weight:900;
      margin-bottom:8px;
      letter-spacing:.06em;
    }
    .bar-wrap{
      width:100%;
      height:18px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.12);
    }
    .bar{
      height:100%;
      width:100%;
      border-radius:999px;
      transition:width .08s linear;
    }
    .bar.player{ background:linear-gradient(90deg,#ff9860,#ff4d63); }
    .bar.enemy{ background:linear-gradient(90deg,#72e3ff,#4b7fff); }
    .bar.super{ background:linear-gradient(90deg,#ffe08a,#ffb300); }

    .small-info{
      margin-top:6px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color:var(--muted);
    }
    #centerInfo{
      font-weight:900;
      letter-spacing:.08em;
      text-align:center;
      text-shadow:0 4px 18px rgba(0,0,0,.5);
    }
    #message{
      position:absolute;
      left:50%;
      top:16%;
      transform:translateX(-50%);
      min-width:240px;
      max-width:84vw;
      text-align:center;
      padding:14px 20px;
      border-radius:20px;
      background:rgba(0,0,0,.5);
      border:1px solid var(--line);
      font-size:clamp(18px,4vw,42px);
      font-weight:900;
      opacity:0;
      transition:opacity .2s ease;
      backdrop-filter:blur(8px);
    }
    #message.show{ opacity:1; }

    #pauseWrap{
      position:absolute;
      top:16px;
      right:16px;
      display:none;
      z-index:11;
    }
    #pauseBtn{
      min-width:auto;
      width:54px;
      height:54px;
      padding:0;
      border-radius:50%;
      font-size:18px;
      pointer-events:auto;
      background:linear-gradient(180deg,#5b6885,#2a3246);
    }

    #mobileControls{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:none;
      justify-content:space-between;
      align-items:flex-end;
      padding:14px max(14px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      z-index:10;
      pointer-events:none;
    }
    .pad{
      display:flex;
      gap:10px;
      align-items:flex-end;
      pointer-events:auto;
    }
    .pad.right{ align-items:center; }
    .touch-btn{
      width:68px;
      height:68px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:21px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.12);
      backdrop-filter:blur(8px);
      box-shadow:var(--shadow);
      pointer-events:auto;
      touch-action:none;
    }
    .touch-btn.big{
      width:78px;
      height:78px;
      font-size:24px;
    }
    .touch-btn.active,.touch-btn:active{
      transform:scale(.96);
      background:rgba(255,255,255,.2);
    }

    .help-box{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      text-align:left;
      margin:16px 0;
    }

    #rotateNotice{
      position:absolute;
      inset:0;
      display:none;
      z-index:50;
      background:#000;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      font-size:clamp(22px,5vw,42px);
      font-weight:900;
      letter-spacing:.05em;
    }

    @media (max-width:940px){
      #mobileControls{ display:flex; }
      .pick-grid{ grid-template-columns:1fr; }
      button,select{ min-width:200px; }
    }
    @media (orientation:portrait) and (max-width:1100px){
      #rotateNotice{ display:flex; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="menuScreen" class="screen show">
    <div class="panel">
      <h1>FIGHT GAME</h1>
      <div class="sub">キャラ選択 / ステージ補正 / コマンド必殺 / ハメ防止 改修版</div>

      <div class="stack">
        <button id="startBtn">START</button>

        <select id="difficultySelect">
          <option value="normal" selected>CPU強さ: NORMAL</option>
          <option value="hard">CPU強さ: HARD</option>
          <option value="god">CPU強さ: GOD</option>
        </select>

        <select id="stageSelect">
          <option value="dojo" selected>ステージ: DOJO</option>
          <option value="ruins">ステージ: RUINS</option>
          <option value="neon">ステージ: NEON CITY</option>
        </select>

        <button id="characterBtn" class="secondary">キャラクター選択</button>
        <button id="helpBtn" class="secondary">操作説明</button>
      </div>
    </div>
  </div>

  <div id="helpScreen" class="screen">
    <div class="panel">
      <h2>操作説明</h2>
      <div class="help-box" id="helpContent"></div>
      <div class="row">
        <button id="helpBackBtn" class="secondary">戻る</button>
      </div>
    </div>
  </div>

  <div id="characterScreen" class="screen">
    <div class="panel">
      <h2>キャラクター選択</h2>
      <p>プレイヤーキャラを選んでください。ステージによって相性補正があります。</p>
      <div class="pick-grid" id="characterGrid"></div>
      <div class="row">
        <button id="characterBackBtn" class="secondary">戻る</button>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="top-ui">
      <div class="fighter-panel">
        <div class="fighter-name" id="leftName">PLAYER</div>
        <div class="bar-wrap"><div id="playerHpBar" class="bar player"></div></div>
        <div class="bar-wrap" style="margin-top:8px;height:12px;"><div id="playerSuperBar" class="bar super"></div></div>
        <div class="small-info">
          <span id="playerHpText">HP 100 / 100</span>
          <span id="comboText">COMBO 0</span>
        </div>
      </div>

      <div>
        <div id="centerInfo">READY</div>
      </div>

      <div class="fighter-panel">
        <div class="fighter-name" id="rightName" style="text-align:right;">ENEMY</div>
        <div class="bar-wrap"><div id="enemyHpBar" class="bar enemy"></div></div>
        <div class="bar-wrap" style="margin-top:8px;height:12px;"><div id="enemySuperBar" class="bar super"></div></div>
        <div class="small-info">
          <span id="difficultyText">NORMAL</span>
          <span id="enemyHpText">HP 100 / 100</span>
        </div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <div id="pauseWrap">
    <button id="pauseBtn">≡</button>
  </div>

  <div id="mobileControls">
    <div class="pad left">
      <div class="touch-btn" id="leftBtn">←</div>
      <div class="touch-btn big" id="jumpBtn">↑</div>
      <div class="touch-btn" id="rightBtn">→</div>
    </div>
    <div class="pad right">
      <div class="touch-btn" id="punchBtn">P</div>
      <div class="touch-btn" id="kickBtn">K</div>
      <div class="touch-btn big" id="specialBtn">S</div>
    </div>
  </div>

  <div id="rotateNotice">横画面でプレイしてください</div>
</div>

<script>
(() => {
  const CHARACTERS = {
    ryu: {
      key: "ryu",
      name: "RYU",
      style: "バランス",
      color: "#ff5566",
      accent: "#ffd2d6",
      speed: 4.6,
      jump: 16,
      atk: 1.0,
      def: 1.0,
      superGain: 1.0,
      specialName: "波動拳"
    },
    blade: {
      key: "blade",
      name: "BLADE",
      style: "スピード",
      color: "#4fa7ff",
      accent: "#d4e7ff",
      speed: 5.3,
      jump: 17,
      atk: 0.92,
      def: 0.95,
      superGain: 1.15,
      specialName: "ソニックラッシュ"
    },
    titan: {
      key: "titan",
      name: "TITAN",
      style: "パワー",
      color: "#ffb14d",
      accent: "#ffe0b2",
      speed: 4.0,
      jump: 14.5,
      atk: 1.16,
      def: 1.12,
      superGain: 0.9,
      specialName: "グランドブレイク"
    }
  };

  const STAGES = {
    dojo: {
      label: "DOJO",
      skyTop: "#2b3752",
      skyBottom: "#10141f",
      floor: "#2d1d17",
      line: "#6e4c3b",
      buff: { ryu: { atk: 1.1 }, blade: { atk: 0.97 }, titan: { atk: 1.0 } }
    },
    ruins: {
      label: "RUINS",
      skyTop: "#4b3a2f",
      skyBottom: "#16110f",
      floor: "#4e4035",
      line: "#8d7765",
      buff: { ryu: { atk: 0.98 }, blade: { atk: 1.0 }, titan: { atk: 1.12 } }
    },
    neon: {
      label: "NEON CITY",
      skyTop: "#231f55",
      skyBottom: "#060710",
      floor: "#19243d",
      line: "#3a6ba1",
      buff: { ryu: { atk: 1.0 }, blade: { atk: 1.1 }, titan: { atk: 0.98 } }
    }
  };

  const menuScreen = document.getElementById("menuScreen");
  const helpScreen = document.getElementById("helpScreen");
  const characterScreen = document.getElementById("characterScreen");
  const helpContent = document.getElementById("helpContent");
  const characterGrid = document.getElementById("characterGrid");

  const startBtn = document.getElementById("startBtn");
  const helpBtn = document.getElementById("helpBtn");
  const helpBackBtn = document.getElementById("helpBackBtn");
  const characterBtn = document.getElementById("characterBtn");
  const characterBackBtn = document.getElementById("characterBackBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const pauseWrap = document.getElementById("pauseWrap");
  const difficultySelect = document.getElementById("difficultySelect");
  const stageSelect = document.getElementById("stageSelect");

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");
  const messageEl = document.getElementById("message");

  const playerHpBar = document.getElementById("playerHpBar");
  const enemyHpBar = document.getElementById("enemyHpBar");
  const playerSuperBar = document.getElementById("playerSuperBar");
  const enemySuperBar = document.getElementById("enemySuperBar");
  const playerHpText = document.getElementById("playerHpText");
  const enemyHpText = document.getElementById("enemyHpText");
  const comboText = document.getElementById("comboText");
  const centerInfo = document.getElementById("centerInfo");
  const difficultyText = document.getElementById("difficultyText");
  const leftName = document.getElementById("leftName");
  const rightName = document.getElementById("rightName");

  const touchButtons = {
    left: document.getElementById("leftBtn"),
    right: document.getElementById("rightBtn"),
    jump: document.getElementById("jumpBtn"),
    punch: document.getElementById("punchBtn"),
    kick: document.getElementById("kickBtn"),
    special: document.getElementById("specialBtn")
  };

  function fitCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  fitCanvas();
  window.addEventListener("resize", fitCanvas);

  const isMobile = matchMedia("(max-width: 940px)").matches || ("ontouchstart" in window);

  function setHelpText() {
    if (isMobile) {
      helpContent.innerHTML = `
        <p><strong>スマホ版操作</strong></p>
        <p>← → : 移動</p>
        <p>↑ : ジャンプ</p>
        <p>P : パンチ</p>
        <p>K : キック</p>
        <p>S : コマンド完成後に必殺技</p>
        <p style="margin-top:12px;"><strong>コマンド</strong></p>
        <p>→ → + P : ダッシュパンチ</p>
        <p>↓ → + S : 必殺技</p>
        <p>必殺技ゲージが 50 以上ないと発動しません。</p>
      `;
    } else {
      helpContent.innerHTML = `
        <p><strong>PC版操作</strong></p>
        <p>← → : 移動</p>
        <p>↑ : ジャンプ</p>
        <p>Z : パンチ</p>
        <p>X : キック</p>
        <p>C : コマンド完成後に必殺技</p>
        <p style="margin-top:12px;"><strong>コマンド</strong></p>
        <p>→ → + Z : ダッシュパンチ</p>
        <p>↓ → + C : 必殺技</p>
        <p>必殺技ゲージが 50 以上ないと発動しません。</p>
      `;
    }
  }
  setHelpText();

  let selectedCharacter = "ryu";

  function renderCharacterCards() {
    characterGrid.innerHTML = "";
    Object.values(CHARACTERS).forEach(ch => {
      const el = document.createElement("div");
      el.className = "card" + (selectedCharacter === ch.key ? " active" : "");
      el.innerHTML = `
        <h3>${ch.name}</h3>
        <p>${ch.style}</p>
        <p>速度 ${ch.speed.toFixed(1)} / 攻撃 ${ch.atk.toFixed(2)} / 防御 ${ch.def.toFixed(2)}</p>
        <span class="tag">${ch.specialName}</span>
      `;
      el.addEventListener("click", () => {
        selectedCharacter = ch.key;
        renderCharacterCards();
      });
      characterGrid.appendChild(el);
    });
  }
  renderCharacterCards();

  const keys = {
    left:false,
    right:false,
    jump:false,
    punch:false,
    kick:false,
    special:false,
    down:false
  };

  let gameRunning = false;
  let gameOver = false;
  let animationId = 0;
  let lastTime = performance.now();
  let combo = 0;
  let lastHitTime = 0;
  let cameraShake = 0;
  let particles = [];
  let commandBuffer = [];
  let pressedThisFrame = { punch:false, kick:false, special:false };
  let roundTimer = 99;

  const gravity = 0.9;
  const groundOffset = 120;

  function groundY() {
    return canvas.height - groundOffset;
  }

  function difficultyConfig() {
    const v = difficultySelect.value;
    if (v === "hard") return { label:"HARD", speed:4.2, react:0.78, attackRate:0.032, defend:0.22 };
    if (v === "god") return { label:"GOD", speed:4.8, react:0.92, attackRate:0.05, defend:0.35 };
    return { label:"NORMAL", speed:3.6, react:0.62, attackRate:0.022, defend:0.14 };
  }

  function stageBuff(characterKey) {
    const st = STAGES[stageSelect.value];
    return st.buff[characterKey] || { atk:1.0 };
  }

  function baseStatsFromCharacter(characterKey) {
    const ch = CHARACTERS[characterKey];
    const sb = stageBuff(characterKey);
    return {
      speed: ch.speed,
      jump: ch.jump,
      atk: ch.atk * (sb.atk || 1),
      def: ch.def,
      superGain: ch.superGain,
      color: ch.color,
      accent: ch.accent,
      name: ch.name,
      specialName: ch.specialName
    };
  }

  function createFighter(characterKey, isPlayer) {
    const st = baseStatsFromCharacter(characterKey);
    return {
      characterKey,
      name: st.name,
      specialName: st.specialName,
      x: isPlayer ? 180 : canvas.width - 260,
      y: groundY() - 130,
      w: 78,
      h: 130,
      vx: 0,
      vy: 0,
      dir: isPlayer ? 1 : -1,
      speed: st.speed,
      jumpPower: st.jump,
      hp: 100,
      maxHp: 100,
      super: 0,
      maxSuper: 100,
      atkMul: st.atk,
      defMul: st.def,
      superGain: st.superGain,
      color: st.color,
      accent: st.accent,
      onGround: true,
      dead: false,

      state: "idle",
      attackType: "",
      attackTimer: 0,
      attackCooldown: 0,
      hitstun: 0,
      invuln: 0,
      guardTimer: 0,
      hurtFlash: 0,
      hasHitCurrentAttack: false,
      isPlayer,
      aiThink: 0,
      canAirControl: true
    };
  }

  let player = createFighter(selectedCharacter, true);
  let enemy = createFighter(pickEnemyCharacter(), false);

  function pickEnemyCharacter() {
    const stage = stageSelect.value;
    if (stage === "dojo") return "ryu";
    if (stage === "ruins") return "titan";
    return "blade";
  }

  function resetBattle() {
    player = createFighter(selectedCharacter, true);
    enemy = createFighter(pickEnemyCharacter(), false);
    combo = 0;
    lastHitTime = 0;
    cameraShake = 0;
    particles = [];
    commandBuffer = [];
    roundTimer = 99;
    gameOver = false;
    leftName.textContent = player.name;
    rightName.textContent = enemy.name;
    difficultyText.textContent = difficultyConfig().label + " / " + STAGES[stageSelect.value].label;
    centerInfo.textContent = "READY";
    comboText.textContent = "COMBO 0";
    showMessage("READY", 900);
  }

  function clearScreens() {
    menuScreen.classList.remove("show");
    helpScreen.classList.remove("show");
    characterScreen.classList.remove("show");
  }

  function showMenu() {
    stopGame();
    clearScreens();
    menuScreen.classList.add("show");
  }

  function startGame() {
    resetBattle();
    clearScreens();
    canvas.style.display = "block";
    hud.style.display = "block";
    pauseWrap.style.display = "block";
    gameRunning = true;
    lastTime = performance.now();
    cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(loop);
  }

  function stopGame() {
    gameRunning = false;
    cancelAnimationFrame(animationId);
    canvas.style.display = "none";
    hud.style.display = "none";
    pauseWrap.style.display = "none";
    resetInput();
  }

  function resetInput() {
    Object.keys(keys).forEach(k => keys[k] = false);
    Object.keys(pressedThisFrame).forEach(k => pressedThisFrame[k] = false);
    Object.values(touchButtons).forEach(btn => btn.classList.remove("active"));
  }

  function showMessage(text, ms=1200) {
    messageEl.textContent = text;
    messageEl.classList.add("show");
    clearTimeout(showMessage.timer);
    showMessage.timer = setTimeout(() => {
      messageEl.classList.remove("show");
    }, ms);
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function distX(a,b) {
    return Math.abs((a.x + a.w/2) - (b.x + b.w/2));
  }

  function facingUpdate(a,b) {
    a.dir = (a.x + a.w/2 < b.x + b.w/2) ? 1 : -1;
  }

  function getBodyRect(f) {
    return { x:f.x, y:f.y, w:f.w, h:f.h };
  }

  function rectsOverlap(a,b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function getAttackRect(f) {
    let range = 0, height = 0, yOffset = 0;
    if (f.attackType === "punch") { range = 34; height = 24; yOffset = 36; }
    if (f.attackType === "kick") { range = 54; height = 34; yOffset = 68; }
    if (f.attackType === "dashPunch") { range = 72; height = 30; yOffset = 36; }
    if (f.attackType === "special") { range = 110; height = 48; yOffset = 32; }
    if (f.dir === 1) {
      return { x:f.x + f.w - 4, y:f.y + yOffset, w:range, h:height };
    }
    return { x:f.x - range + 4, y:f.y + yOffset, w:range, h:height };
  }

  function attackData(type) {
    if (type === "punch") return { timer:11, cooldown:12, damage:6, kb:10, superGain:8 };
    if (type === "kick") return { timer:16, cooldown:18, damage:10, kb:15, superGain:11 };
    if (type === "dashPunch") return { timer:14, cooldown:18, damage:12, kb:18, superGain:14 };
    if (type === "special") return { timer:26, cooldown:34, damage:18, kb:26, superGain:0, cost:50 };
    return { timer:0, cooldown:0, damage:0, kb:0, superGain:0 };
  }

  function attackActiveFrame(type, timer) {
    if (type === "punch") return timer >= 5 && timer <= 7;
    if (type === "kick") return timer >= 8 && timer <= 12;
    if (type === "dashPunch") return timer >= 6 && timer <= 10;
    if (type === "special") return timer >= 10 && timer <= 18;
    return false;
  }

  function spawnImpact(x, y, color, count=8) {
    for (let i=0;i<count;i++) {
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*6,
        vy:(Math.random()-0.5)*6 - 1,
        life:18 + Math.random()*10,
        size:3 + Math.random()*4,
        color
      });
    }
  }

  function recordCommand(dir) {
    const now = performance.now();
    commandBuffer.push({ dir, time: now });
    commandBuffer = commandBuffer.filter(v => now - v.time < 500);
  }

  function commandMatched(sequence) {
    if (commandBuffer.length < sequence.length) return false;
    const arr = commandBuffer.map(v => v.dir);
    const tail = arr.slice(-sequence.length).join(",");
    return tail === sequence.join(",");
  }

  function tryStartAttack(f, type) {
    if (f.dead || f.hitstun > 0 || f.invuln > 0 && type !== "special") return false;
    if (f.attackTimer > 0 || f.attackCooldown > 0) return false;

    const data = attackData(type);
    if (type === "special" && f.super < data.cost) return false;

    if (type === "special") {
      f.super = clamp(f.super - data.cost, 0, f.maxSuper);
    }

    f.attackType = type;
    f.attackTimer = data.timer;
    f.attackCooldown = data.cooldown;
    f.state = "attack";
    f.hasHitCurrentAttack = false;

    if (type === "dashPunch") {
      f.vx = 7 * f.dir;
    }

    showSmallAttackMessage(f, type);
    return true;
  }

  function showSmallAttackMessage(f, type) {
    if (!f.isPlayer) return;
    if (type === "special") showMessage(f.specialName, 500);
    if (type === "dashPunch") showMessage("DASH PUNCH", 350);
  }

  function gainSuper(f, value) {
    f.super = clamp(f.super + value * f.superGain, 0, f.maxSuper);
  }

  function applyDamage(attacker, target) {
    const data = attackData(attacker.attackType);
    let damage = data.damage * attacker.atkMul / target.defMul;
    let kb = data.kb;

    if (target.guardTimer > 0 && facingProperForGuard(target, attacker)) {
      damage *= 0.35;
      kb *= 0.5;
      target.hitstun = 6;
      target.invuln = 6;
      spawnImpact(target.x + target.w/2, target.y + 40, "#aee1ff", 6);
    } else {
      target.hitstun = attacker.attackType === "special" ? 18 : 11;
      target.invuln = attacker.attackType === "special" ? 14 : 9;
      spawnImpact(target.x + target.w/2, target.y + 36, "#ffffff", attacker.attackType === "special" ? 12 : 8);
    }

    target.hp = clamp(target.hp - damage, 0, target.maxHp);
    target.hurtFlash = 8;
    target.x += kb * (attacker.dir === 1 ? 1 : -1);
    target.vx = kb * 0.18 * (attacker.dir === 1 ? 1 : -1);
    if (attacker.attackType === "special") target.vy = -4;

    gainSuper(attacker, data.superGain);
    gainSuper(target, 4);

    attacker.hasHitCurrentAttack = true;
    cameraShake = attacker.attackType === "special" ? 10 : 4;

    if (attacker.isPlayer) {
      const now = performance.now();
      combo = (now - lastHitTime < 1200) ? combo + 1 : 1;
      lastHitTime = now;
      comboText.textContent = "COMBO " + combo;
    }

    if (target.hp <= 0) {
      target.dead = true;
      gameOver = true;
      showMessage(attacker.isPlayer ? "YOU WIN" : "YOU LOSE", 2200);
      setTimeout(showMenu, 2300);
    }
  }

  function facingProperForGuard(target, attacker) {
    return (target.dir === -attacker.dir);
  }

  function resolveAttackHit(attacker, target) {
    if (!attacker.attackType || attacker.hasHitCurrentAttack) return;
    if (!attackActiveFrame(attacker.attackType, attacker.attackTimer)) return;
    if (target.invuln > 0) return;

    const atk = getAttackRect(attacker);
    const body = getBodyRect(target);

    if (rectsOverlap(atk, body)) {
      applyDamage(attacker, target);
    }
  }

  function updateCommandInputs() {
    if (pressedThisFrame.punch) {
      if (commandMatched(["R","R"])) {
        if (tryStartAttack(player, "dashPunch")) {
          commandBuffer = [];
          pressedThisFrame.punch = false;
          return;
        }
      }
      tryStartAttack(player, "punch");
    }

    if (pressedThisFrame.kick) {
      tryStartAttack(player, "kick");
    }

    if (pressedThisFrame.special) {
      if (commandMatched(["D","R"])) {
        if (tryStartAttack(player, "special")) {
          commandBuffer = [];
        }
      }
    }
  }

  function updatePlayer() {
    if (player.dead) return;

    facingUpdate(player, enemy);

    if (player.invuln > 0) player.invuln--;
    if (player.hitstun > 0) player.hitstun--;
    if (player.guardTimer > 0) player.guardTimer--;
    if (player.attackCooldown > 0) player.attackCooldown--;
    if (player.hurtFlash > 0) player.hurtFlash--;

    if (player.attackTimer > 0) {
      player.attackTimer--;
      if (player.attackType === "dashPunch") {
        player.vx = 5 * player.dir;
      }
      if (player.attackTimer === 0) {
        player.attackType = "";
        player.state = "idle";
        player.hasHitCurrentAttack = false;
      }
    }

    if (player.hitstun <= 0 && player.attackTimer <= 0) {
      if (keys.left && !keys.right) player.vx = -player.speed;
      else if (keys.right && !keys.left) player.vx = player.speed;
      else player.vx *= 0.72;

      if (keys.jump && player.onGround) {
        player.vy = -player.jumpPower;
        player.onGround = false;
      }

      player.guardTimer = keys.down ? 2 : 0;
      updateCommandInputs();
    } else if (player.hitstun > 0) {
      player.vx *= 0.9;
    }

    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    if (player.y >= groundY() - player.h) {
      player.y = groundY() - player.h;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }

    player.x = clamp(player.x, 20, canvas.width - player.w - 20);
  }

  function aiWantsGuard() {
    const d = distX(enemy, player);
    return d < 88 && Math.random() < difficultyConfig().defend;
  }

  function updateEnemyAI() {
    if (enemy.dead) return;

    facingUpdate(enemy, player);

    if (enemy.invuln > 0) enemy.invuln--;
    if (enemy.hitstun > 0) enemy.hitstun--;
    if (enemy.guardTimer > 0) enemy.guardTimer--;
    if (enemy.attackCooldown > 0) enemy.attackCooldown--;
    if (enemy.hurtFlash > 0) enemy.hurtFlash--;

    if (enemy.attackTimer > 0) {
      enemy.attackTimer--;
      if (enemy.attackType === "dashPunch") {
        enemy.vx = 5.5 * enemy.dir;
      }
      if (enemy.attackTimer === 0) {
        enemy.attackType = "";
        enemy.state = "idle";
        enemy.hasHitCurrentAttack = false;
      }
    }

    if (enemy.hitstun <= 0 && enemy.attackTimer <= 0) {
      const d = distX(enemy, player);
      const cfg = difficultyConfig();

      if (aiWantsGuard()) {
        enemy.guardTimer = 2;
      } else {
        enemy.guardTimer = 0;
      }

      if (d > 135) {
        enemy.vx = enemy.dir === 1 ? cfg.speed : -cfg.speed;
      } else if (d < 78) {
        enemy.vx = enemy.dir === 1 ? -cfg.speed * 0.75 : cfg.speed * 0.75;
      } else {
        enemy.vx *= 0.65;
      }

      if (enemy.onGround && Math.random() < 0.0025 && d > 120 && d < 230) {
        enemy.vy = -enemy.jumpPower * 0.94;
        enemy.onGround = false;
      }

      const react = cfg.react;

      if (d < 82 && Math.random() < 0.025 * react) {
        tryStartAttack(enemy, "punch");
      } else if (d < 105 && Math.random() < 0.02 * react) {
        tryStartAttack(enemy, "kick");
      } else if (d < 130 && enemy.super >= 50 && Math.random() < 0.013 * react) {
        tryStartAttack(enemy, "special");
      } else if (d > 90 && d < 150 && Math.random() < 0.012 * react) {
        tryStartAttack(enemy, "dashPunch");
      }
    } else if (enemy.hitstun > 0) {
      enemy.vx *= 0.9;
    }

    enemy.vy += gravity;
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;

    if (enemy.y >= groundY() - enemy.h) {
      enemy.y = groundY() - enemy.h;
      enemy.vy = 0;
      enemy.onGround = true;
    } else {
      enemy.onGround = false;
    }

    enemy.x = clamp(enemy.x, 20, canvas.width - enemy.w - 20);
  }

  function resolvePush() {
    const a = getBodyRect(player);
    const b = getBodyRect(enemy);
    if (!rectsOverlap(a, b)) return;

    const overlap = (a.x + a.w) - b.x;
    if (overlap > 0) {
      player.x -= overlap / 2;
      enemy.x += overlap / 2;
      player.x = clamp(player.x, 20, canvas.width - player.w - 20);
      enemy.x = clamp(enemy.x, 20, canvas.width - enemy.w - 20);
    }
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= 1;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function updateGame(dt) {
    if (gameOver) return;

    roundTimer -= dt / 1000;
    if (roundTimer < 0) roundTimer = 0;
    centerInfo.textContent = `${STAGES[stageSelect.value].label} / ${Math.ceil(roundTimer)}`;

    updatePlayer();
    updateEnemyAI();

    resolvePush();
    resolveAttackHit(player, enemy);
    resolveAttackHit(enemy, player);
    updateParticles();

    if (performance.now() - lastHitTime > 1300 && combo !== 0) {
      combo = 0;
      comboText.textContent = "COMBO 0";
    }

    if (!gameOver && roundTimer <= 0) {
      gameOver = true;
      if (player.hp > enemy.hp) showMessage("TIME UP - YOU WIN", 2000);
      else if (enemy.hp > player.hp) showMessage("TIME UP - YOU LOSE", 2000);
      else showMessage("DRAW", 2000);
      setTimeout(showMenu, 2100);
    }

    Object.keys(pressedThisFrame).forEach(k => pressedThisFrame[k] = false);
  }

  function drawBackground() {
    const st = STAGES[stageSelect.value];
    const horizon = canvas.height * 0.62;

    const grad = ctx.createLinearGradient(0, 0, 0, horizon);
    grad.addColorStop(0, st.skyTop);
    grad.addColorStop(1, st.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, horizon);

    ctx.fillStyle = st.floor;
    ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

    ctx.fillStyle = "rgba(255,255,255,.04)";
    for (let i = 0; i < 7; i++) {
      const bw = 80 + (i % 3) * 50;
      const bh = 120 + (i % 4) * 24;
      const bx = i * (canvas.width / 7);
      const by = horizon - bh;
      ctx.fillRect(bx, by, bw, bh);
    }

    ctx.fillStyle = st.line;
    for (let i = 0; i < canvas.width; i += 80) {
      ctx.fillRect(i, horizon + 42, 46, 3);
    }
  }

  function drawFighter(f) {
    const x = Math.round(f.x);
    const y = Math.round(f.y);

    ctx.save();

    if (f.hurtFlash > 0) ctx.globalAlpha = 0.82;

    // shadow
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(x + f.w / 2, groundY() - 2, 34, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    ctx.fillStyle = f.hurtFlash > 0 ? "#ffffff" : f.color;
    ctx.strokeStyle = f.accent;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.roundRect(x + 10, y + 18, f.w - 20, f.h - 28, 18);
    ctx.fill();
    ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(x + f.w / 2, y + 10, 19, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // belt / chest accent
    ctx.fillStyle = "rgba(255,255,255,.18)";
    ctx.fillRect(x + 18, y + 54, f.w - 36, 8);

    const cx = x + f.w / 2;
    const armY = y + 48;
    const legBase = y + f.h - 26;
    const footY = y + f.h - 2;
    const forward = f.dir === 1 ? 1 : -1;

    ctx.strokeStyle = f.accent;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";

    // front arm
    ctx.beginPath();
    ctx.moveTo(cx, armY);
    if (f.attackTimer > 0) {
      const len = f.attackType === "punch" ? 40 : f.attackType === "kick" ? 22 : f.attackType === "dashPunch" ? 52 : 62;
      ctx.lineTo(cx + len * forward, armY - (f.attackType === "special" ? 6 : 0));
    } else {
      ctx.lineTo(cx + 18 * forward, armY + 12);
    }
    ctx.stroke();

    // back arm
    ctx.beginPath();
    ctx.moveTo(cx, armY);
    ctx.lineTo(cx - 18 * forward, armY + 12);
    ctx.stroke();

    // front leg
    ctx.beginPath();
    ctx.moveTo(cx, legBase);
    if (f.attackTimer > 0 && f.attackType === "kick") {
      ctx.lineTo(cx + 46 * forward, legBase + 6);
    } else {
      ctx.lineTo(cx + 16, footY);
    }
    ctx.stroke();

    // back leg
    ctx.beginPath();
    ctx.moveTo(cx, legBase);
    ctx.lineTo(cx - 16, footY);
    ctx.stroke();

    // guard aura
    if (f.guardTimer > 0) {
      ctx.strokeStyle = "rgba(165,220,255,.65)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, y + 45, 36, 0, Math.PI * 2);
      ctx.stroke();
    }

    // special / active effect
    if (f.attackTimer > 0) {
      const atk = getAttackRect(f);
      if (f.attackType === "special") {
        ctx.fillStyle = "rgba(255,210,77,.3)";
        ctx.strokeStyle = "rgba(255,230,166,.8)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(atk.x, atk.y, atk.w, atk.h, 16);
        ctx.fill();
        ctx.stroke();
      } else if (attackActiveFrame(f.attackType, f.attackTimer)) {
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.beginPath();
        ctx.roundRect(atk.x, atk.y, atk.w, atk.h, 14);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 28);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    playerHpBar.style.width = ((player.hp / player.maxHp) * 100) + "%";
    enemyHpBar.style.width = ((enemy.hp / enemy.maxHp) * 100) + "%";
    playerSuperBar.style.width = ((player.super / player.maxSuper) * 100) + "%";
    enemySuperBar.style.width = ((enemy.super / enemy.maxSuper) * 100) + "%";
    playerHpText.textContent = `HP ${Math.ceil(player.hp)} / ${player.maxHp} | SUPER ${Math.floor(player.super)}`;
    enemyHpText.textContent = `HP ${Math.ceil(enemy.hp)} / ${enemy.maxHp} | SUPER ${Math.floor(enemy.super)}`;
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const shakeX = cameraShake > 0 ? (Math.random() - 0.5) * cameraShake : 0;
    const shakeY = cameraShake > 0 ? (Math.random() - 0.5) * cameraShake : 0;

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawBackground();
    drawFighter(player);
    drawFighter(enemy);
    drawParticles();

    ctx.restore();

    if (cameraShake > 0) cameraShake *= 0.82;
    if (cameraShake < 0.3) cameraShake = 0;

    drawHud();
  }

  function loop(now) {
    const dt = Math.min(32, now - lastTime);
    lastTime = now;

    if (!gameRunning) return;

    updateGame(dt);
    render();

    animationId = requestAnimationFrame(loop);
  }

  function setKeyFromCode(code, pressed) {
    if (code === "ArrowLeft") {
      if (pressed && !keys.left) recordCommand("L");
      keys.left = pressed;
    }
    if (code === "ArrowRight") {
      if (pressed && !keys.right) recordCommand("R");
      keys.right = pressed;
    }
    if (code === "ArrowUp") keys.jump = pressed;
    if (code === "ArrowDown") {
      if (pressed && !keys.down) recordCommand("D");
      keys.down = pressed;
    }

    if (code === "KeyZ") {
      if (pressed) pressedThisFrame.punch = true;
      keys.punch = pressed;
    }
    if (code === "KeyX") {
      if (pressed) pressedThisFrame.kick = true;
      keys.kick = pressed;
    }
    if (code === "KeyC") {
      if (pressed) pressedThisFrame.special = true;
      keys.special = pressed;
    }
  }

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","KeyZ","KeyX","KeyC","Space"].includes(e.code)) {
      e.preventDefault();
    }
    setKeyFromCode(e.code, true);
  }, { passive:false });

  window.addEventListener("keyup", (e) => {
    setKeyFromCode(e.code, false);
  });

  function bindTouchButton(el, keyName, recordDir = null) {
    const on = (e) => {
      e.preventDefault();
      keys[keyName] = true;
      if (recordDir) recordCommand(recordDir);
      if (keyName === "punch") pressedThisFrame.punch = true;
      if (keyName === "kick") pressedThisFrame.kick = true;
      if (keyName === "special") pressedThisFrame.special = true;
      el.classList.add("active");
    };
    const off = (e) => {
      e.preventDefault();
      keys[keyName] = false;
      el.classList.remove("active");
    };
    el.addEventListener("pointerdown", on, { passive:false });
    el.addEventListener("pointerup", off, { passive:false });
    el.addEventListener("pointercancel", off, { passive:false });
    el.addEventListener("pointerleave", off, { passive:false });
  }

  bindTouchButton(touchButtons.left, "left", "L");
  bindTouchButton(touchButtons.right, "right", "R");
  bindTouchButton(touchButtons.jump, "jump");
  bindTouchButton(touchButtons.punch, "punch");
  bindTouchButton(touchButtons.kick, "kick");
  bindTouchButton(touchButtons.special, "special");

  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("selectstart", (e) => e.preventDefault());
  document.addEventListener("dragstart", (e) => e.preventDefault());

  startBtn.addEventListener("click", startGame);
  helpBtn.addEventListener("click", () => {
    clearScreens();
    setHelpText();
    helpScreen.classList.add("show");
  });
  helpBackBtn.addEventListener("click", () => {
    clearScreens();
    menuScreen.classList.add("show");
  });
  characterBtn.addEventListener("click", () => {
    clearScreens();
    renderCharacterCards();
    characterScreen.classList.add("show");
  });
  characterBackBtn.addEventListener("click", () => {
    clearScreens();
    menuScreen.classList.add("show");
  });
  pauseBtn.addEventListener("click", showMenu);

  showMenu();
})();
</script>
</body>
</html>
