<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>格闘ゲーム SF6風 ぬるぬる待機モーション版</title>
  <style>
    :root{
      --bg1:#0a1021;
      --bg2:#17284b;
      --bg3:#070b14;
      --panel:rgba(8,12,22,.92);
      --line:rgba(255,255,255,.12);
      --text:#eef3ff;
      --muted:#a9b6d8;
      --red1:#ff6b7a;
      --red2:#c9344f;
      --blue1:#67b7ff;
      --blue2:#306eff;
      --gold1:#ffe38a;
      --gold2:#ffb300;
      --green1:#60ecb3;
      --green2:#18af7b;
      --vio1:#c58cff;
      --vio2:#7f47ff;
      --shadow:0 18px 50px rgba(0,0,0,.44);
      --gameScale:.88;
      --hudTop:6px;
      --moveBtn:60px;
      --actionBtn:72px;
      --specialBtn:84px;
      --mobileGap:6px;
    }

    *{
      box-sizing:border-box;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      touch-action:manipulation;
    }
    body.game-active{ touch-action:none; }

    #app{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(99,145,255,.16), transparent 22%),
        radial-gradient(circle at 80% 10%, rgba(255,120,170,.12), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(90,255,210,.10), transparent 30%),
        linear-gradient(180deg,var(--bg2),var(--bg1) 42%,var(--bg3));
    }

    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:none;
      background:#000;
    }

    .screen{
      position:absolute;
      inset:0;
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:10px;
      padding-top:clamp(12px, 2vh, 20px);
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.06), transparent 34%),
        linear-gradient(180deg, rgba(14,22,42,.92), rgba(0,0,0,.95));
      z-index:70;
    }
    .screen.show{ display:flex; }

    .panel{
      width:min(96vw,1180px);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:24px;
      padding:14px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      text-align:center;
      margin:0 auto;
    }

    .menu-panel{
      border-radius:30px;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(circle at 18% 18%, rgba(255,85,110,.20), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(90,180,255,.20), transparent 24%),
        radial-gradient(circle at 50% 85%, rgba(120,255,210,.10), transparent 28%),
        linear-gradient(180deg, rgba(18,28,56,.96), rgba(5,8,18,.96));
    }

    .menu-kicker{
      display:inline-block;
      padding:5px 12px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.16em;
      color:#06131d;
      background:linear-gradient(180deg,#c3f7ff,#67dfff);
      margin-bottom:8px;
    }

    .hero-title{
      font-size:clamp(22px,4.6vw,58px);
      font-weight:1000;
      letter-spacing:.04em;
      margin:0 0 6px;
      line-height:1.05;
      background:linear-gradient(90deg,#fff,#9dd8ff,#ffd8df,#fff0a3);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 8px 22px rgba(0,0,0,.35);
    }

    .hero-sub{
      max-width:860px;
      margin:0 auto 10px;
      font-size:13px;
      color:#d0dbf6;
      line-height:1.5;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:12px;
      margin-top:10px;
    }

    .menu-col{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:22px;
      padding:14px;
    }

    .menu-btn-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      margin-top:8px;
    }

    .pick-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:10px;
    }

    .info-card,.box{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      padding:12px;
      text-align:left;
      margin-top:10px;
    }

    .command-preview{
      display:grid;
      gap:8px;
      margin-top:8px;
      text-align:left;
    }

    .command-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
    }
    .command-row strong{ font-size:12px; }
    .command-row span{ font-size:11px; color:#c8d5f2; text-align:right; }

    button,select,input{
      border:none;
      outline:none;
      min-width:200px;
      padding:12px 14px;
      border-radius:15px;
      font-size:15px;
      font-weight:900;
      color:#fff;
      box-shadow:var(--shadow);
    }

    button{
      background:linear-gradient(180deg,var(--red1),var(--red2));
      cursor:pointer;
    }
    button.secondary{ background:linear-gradient(180deg,#61718f,#32405c); }
    button.gold{ background:linear-gradient(180deg,var(--gold1),var(--gold2)); color:#2a1800; }
    button.green{ background:linear-gradient(180deg,var(--green1),var(--green2)); color:#04261b; }
    button.violet{ background:linear-gradient(180deg,var(--vio1),var(--vio2)); }
    button.cyan{ background:linear-gradient(180deg,var(--blue1),var(--blue2)); }

    select,input{
      appearance:none;
      background:linear-gradient(180deg,#25324d,#182235);
    }

    input{
      text-align:center;
      text-transform:none;
      letter-spacing:.04em;
      min-width:0;
      width:100%;
    }

    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:18px;
      padding:10px;
      text-align:left;
      cursor:pointer;
      transition:transform .15s ease, border-color .15s ease;
    }
    .card:hover{ transform:translateY(-2px); }
    .card.active{
      border-color:rgba(255,255,255,.38);
      box-shadow:0 0 0 2px rgba(255,255,255,.08) inset;
    }

    .card h3{ margin:0 0 6px; font-size:16px; }
    .card p{ margin:4px 0; font-size:12px; color:var(--muted); }
    .tag{
      display:inline-block;
      margin-right:6px;
      margin-top:6px;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      font-size:10px;
      font-weight:700;
    }

    .rank-item{
      display:grid;
      grid-template-columns:56px 1.5fr .8fr .9fr;
      align-items:center;
      gap:8px;
      padding:9px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:13px;
    }
    .rank-item:last-child{ border-bottom:none; }

    #hud{
      position:absolute;
      inset:0;
      display:none;
      z-index:10;
      pointer-events:none;
    }

    .top-ui{
      position:absolute;
      left:0;
      top:var(--hudTop);
      width:100%;
      padding:0 4px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:4px;
    }

    .fighter-panel{
      width:min(28vw,154px);
      background:rgba(0,0,0,.42);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:5px 5px 4px;
      backdrop-filter:blur(8px);
    }

    .fighter-name{
      font-size:8px;
      font-weight:900;
      margin-bottom:4px;
      letter-spacing:.05em;
    }

    .bar-wrap{
      width:100%;
      height:8px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.12);
    }

    .bar{
      width:100%;
      height:100%;
      border-radius:999px;
      transition:width .08s linear;
    }
    .bar.player{ background:linear-gradient(90deg,#ff9c66,#ff4d63); }
    .bar.enemy{ background:linear-gradient(90deg,#72e3ff,#4b7fff); }
    .bar.super{ background:linear-gradient(90deg,#ffe08a,#ffb300); }
    .bar.awaken{ background:linear-gradient(90deg,#77ffd3,#00d99b); }

    .small-info{
      margin-top:3px;
      display:flex;
      justify-content:space-between;
      gap:6px;
      font-size:6px;
      color:var(--muted);
    }

    #centerWrap{
      padding-top:2px;
      min-width:52px;
      text-align:center;
    }
    #centerInfo{
      font-weight:900;
      letter-spacing:.06em;
      text-align:center;
      text-shadow:0 4px 18px rgba(0,0,0,.5);
      font-size:clamp(9px,2vw,13px);
    }

    #message{
      position:absolute;
      left:50%;
      top:calc(var(--hudTop) + 28px);
      transform:translateX(-50%);
      min-width:90px;
      max-width:78vw;
      text-align:center;
      padding:4px 8px;
      border-radius:14px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);
      font-size:clamp(10px,3vw,15px);
      font-weight:900;
      opacity:0;
      transition:opacity .2s ease;
      backdrop-filter:blur(8px);
    }
    #message.show{ opacity:1; }

    #topButtons{
      position:absolute;
      top:calc(var(--hudTop) + 1px);
      right:6px;
      display:none;
      gap:6px;
      z-index:20;
      pointer-events:auto;
    }
    .mini-btn{
      min-width:auto;
      width:30px;
      height:30px;
      padding:0;
      border-radius:50%;
      font-size:12px;
      background:linear-gradient(180deg,#5b6885,#2a3246);
    }

    #mobileControls{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:none;
      justify-content:space-between;
      align-items:flex-end;
      padding:
        2px
        max(8px, env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      z-index:18;
      pointer-events:none;
    }

    .pad{
      display:flex;
      gap:var(--mobileGap);
      align-items:flex-end;
      pointer-events:auto;
    }

    .dpad{
      display:grid;
      grid-template-columns:repeat(3,var(--moveBtn));
      grid-template-rows:repeat(2,var(--moveBtn));
      gap:var(--mobileGap);
    }

    .touch-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:1000;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.16);
      backdrop-filter:blur(8px);
      box-shadow:var(--shadow);
      border-radius:20px;
      touch-action:none;
      pointer-events:auto;
    }
    .touch-btn.move{ width:var(--moveBtn); height:var(--moveBtn); font-size:18px; }
    .touch-btn.action{ width:var(--actionBtn); height:var(--actionBtn); font-size:20px; }
    .touch-btn.special{ width:var(--specialBtn); height:var(--specialBtn); font-size:22px; }
    .touch-btn.empty{ background:transparent; border:none; box-shadow:none; pointer-events:none; }
    .touch-btn.active,.touch-btn:active{ transform:scale(.96); background:rgba(255,255,255,.26); }

    #rotateNotice{
      position:absolute;
      inset:0;
      display:none;
      z-index:90;
      background:rgba(0,0,0,.92);
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      font-size:clamp(18px,5vw,32px);
      font-weight:900;
      letter-spacing:.05em;
      pointer-events:none;
    }

    #cutinOverlay{
      position:absolute;
      inset:0;
      display:none;
      z-index:66;
      pointer-events:none;
      overflow:hidden;
    }
    #cutinOverlay.show{ display:block; }

    .cutin-bg{
      position:absolute;
      inset:0;
      background:
        linear-gradient(115deg, rgba(255,255,255,.10), transparent 25%, transparent 75%, rgba(255,255,255,.10)),
        linear-gradient(180deg, rgba(6,10,20,.18), rgba(0,0,0,.58));
    }

    .cutin-body{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8vw 6vw;
      gap:20px;
    }

    .cutin-art{
      flex:1;
      min-height:40vh;
      border-radius:28px;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.26), transparent 20%),
        radial-gradient(circle at 65% 65%, rgba(255,255,255,.18), transparent 24%),
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
    }

    .cutin-art::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 35%, var(--cutinColor, rgba(255,120,140,.55)), transparent 22%),
        linear-gradient(180deg, rgba(255,255,255,.10), transparent 45%);
    }

    .cutin-text{ flex:1; text-align:right; }
    .cutin-win{
      font-size:clamp(26px,5vw,62px);
      font-weight:1000;
      letter-spacing:.14em;
      color:#fff;
      text-shadow:0 0 24px rgba(255,255,255,.18), 0 8px 20px rgba(0,0,0,.45);
    }
    .cutin-name{
      font-size:clamp(34px,7vw,86px);
      font-weight:1000;
      letter-spacing:.10em;
      margin-top:8px;
      background:linear-gradient(90deg,#fff,#ffe9a0,#ffd3d8);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    @media (max-width: 940px){
      body.game-active #mobileControls{ display:flex; }
      .menu-grid{ grid-template-columns:1fr; }
      .menu-btn-grid{ grid-template-columns:1fr; }
      .pick-grid{ grid-template-columns:1fr; }
      button,select,input{
        min-width:0;
        width:100%;
        padding:10px 12px;
        font-size:14px;
        border-radius:12px;
      }
    }

    @media (max-width:700px){
      :root{
        --gameScale:.50;
        --moveBtn:54px;
        --actionBtn:64px;
        --specialBtn:74px;
      }
      .fighter-panel{ width:min(30vw,96px); }
      .fighter-name{ font-size:6.5px; }
      .small-info{ font-size:5px; }
      .bar-wrap{ height:6px; }
      #centerInfo{ font-size:9px; }
      #message{ font-size:9px; top:calc(var(--hudTop) + 24px); }
      .hero-sub{ font-size:10px; }
    }

    @media (max-width:480px){
      :root{
        --gameScale:.43;
        --moveBtn:48px;
        --actionBtn:58px;
        --specialBtn:68px;
      }
      .fighter-panel{ width:min(31vw,82px); }
      .small-info{ font-size:4.5px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="menuScreen" class="screen show">
    <div class="panel menu-panel">
      <div class="menu-kicker">SF6 STYLE SMOOTH IDLE VERSION</div>
      <div class="hero-title">格闘ゲーム</div>
      <div class="hero-sub">
        キャラごとに待機モーションを大きく差別化。重心移動、呼吸、首振り、腕さばき、布や髪の揺れを強化。
      </div>

      <div class="menu-grid">
        <div class="menu-col">
          <h2 style="margin:0 0 8px;">バトル開始</h2>
          <div class="menu-btn-grid">
            <button id="startCpuBtn">CPU対戦</button>
            <button id="startMusouBtn" class="violet">無双モード</button>
            <button id="rankingBtn" class="cyan">ランキング</button>
            <button id="helpBtn" class="gold">操作説明</button>
          </div>

          <div class="row" style="margin-top:10px;">
            <input id="playerNameInput" type="text" maxlength="12" placeholder="ランキング名（日本語OK）" />
          </div>

          <div class="row" style="margin-top:10px;">
            <select id="difficultySelect">
              <option value="normal">CPU強さ: NORMAL</option>
              <option value="hard">CPU強さ: HARD</option>
              <option value="god" selected>CPU強さ: GOD</option>
              <option value="boss">CPU強さ: BOSS</option>
            </select>
            <select id="stageSelect">
              <option value="dojo" selected>ステージ: DOJO</option>
              <option value="ruins">ステージ: RUINS</option>
              <option value="neon">ステージ: NEON CITY</option>
              <option value="moon">ステージ: MOON BASE</option>
            </select>
          </div>
        </div>

        <div class="menu-col">
          <div class="row" style="margin-top:0;">
            <button id="characterBtn" class="secondary">キャラクター選択</button>
            <button id="fullscreenBtn" class="secondary">全画面</button>
          </div>

          <div class="info-card">
            <h3 style="margin:0 0 8px;">現在のコマンド</h3>
            <div class="command-preview" id="menuCommandList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="helpScreen" class="screen">
    <div class="panel">
      <h2>操作説明</h2>
      <div class="box" id="helpContent"></div>
      <div class="row">
        <button id="helpBackBtn" class="secondary">戻る</button>
      </div>
    </div>
  </div>

  <div id="characterScreen" class="screen">
    <div class="panel">
      <h2>キャラクター選択</h2>
      <p>キャラごとに体格・顔・待機モーション・必殺が違います。</p>
      <div class="pick-grid" id="characterGrid"></div>
      <div class="box" id="characterCommandBox" style="margin-top:10px;"></div>
      <div class="row">
        <button id="characterBackBtn" class="secondary">戻る</button>
      </div>
    </div>
  </div>

  <div id="rankingScreen" class="screen">
    <div class="panel">
      <h2>ランキング</h2>
      <div class="row">
        <button id="rankBattleBtn" class="secondary">通常戦</button>
        <button id="rankMusouBtn" class="violet">無双</button>
        <button id="rankingResetBtn" class="gold">リセット</button>
      </div>
      <div class="box" id="rankingList">読み込み中...</div>
      <div class="row">
        <button id="rankingBackBtn" class="secondary">戻る</button>
      </div>
    </div>
  </div>

  <div id="resultScreen" class="screen">
    <div class="panel">
      <div id="resultTitle" style="font-size:clamp(28px,7vw,54px);font-weight:900;letter-spacing:.08em;margin-bottom:8px;">YOU WIN</div>
      <div id="resultSub">試合終了</div>
      <div class="row">
        <button id="rematchBtn" class="green">再戦</button>
        <button id="resultMenuBtn" class="secondary">メニューへ戻る</button>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="top-ui">
      <div class="fighter-panel">
        <div class="fighter-name" id="leftName">PLAYER</div>
        <div class="bar-wrap"><div id="playerHpBar" class="bar player"></div></div>
        <div class="bar-wrap" style="margin-top:4px;height:6px;"><div id="playerSuperBar" class="bar super"></div></div>
        <div class="bar-wrap" style="margin-top:4px;height:5px;"><div id="playerAwakenBar" class="bar awaken"></div></div>
        <div class="small-info">
          <span id="playerHpText">HP 100 / 100</span>
          <span id="comboText">COMBO 0</span>
        </div>
      </div>

      <div id="centerWrap">
        <div id="centerInfo">READY</div>
      </div>

      <div class="fighter-panel">
        <div class="fighter-name" id="rightName" style="text-align:right;">CPU</div>
        <div class="bar-wrap"><div id="enemyHpBar" class="bar enemy"></div></div>
        <div class="bar-wrap" style="margin-top:4px;height:6px;"><div id="enemySuperBar" class="bar super"></div></div>
        <div class="bar-wrap" style="margin-top:4px;height:5px;"><div id="enemyAwakenBar" class="bar awaken"></div></div>
        <div class="small-info">
          <span id="difficultyText">CPU</span>
          <span id="enemyHpText">HP 100 / 100</span>
        </div>
      </div>
    </div>
    <div id="message"></div>
  </div>

  <div id="topButtons">
    <button id="backMenuBtn" class="mini-btn">≡</button>
    <button id="gameFullscreenBtn" class="mini-btn">⛶</button>
  </div>

  <div id="mobileControls">
    <div class="pad dpad">
      <div class="touch-btn empty"></div>
      <div class="touch-btn move" id="jumpBtn">↑</div>
      <div class="touch-btn empty"></div>

      <div class="touch-btn move" id="leftBtn">←</div>
      <div class="touch-btn move" id="downBtn">↓</div>

  function attackData(type){
    if (type === "punch") return { timer:11, cooldown:12, damage:6, kb:10, superGain:8 };
    if (type === "kick") return { timer:16, cooldown:18, damage:10, kb:15, superGain:11 };
    if (type === "special") return { timer:24, cooldown:30, damage:17, kb:24, superGain:0 };
    if (type === "burst") return { timer:34, cooldown:40, damage:28, kb:34, superGain:0 };
    if (type === "projectile") return { timer:16, cooldown:18, damage:11, kb:18, superGain:10 };
    return { timer:0, cooldown:0, damage:0, kb:0, superGain:0 };
  }

  function getAttackRect(f){
    if (f.attackType === "command" && f.commandData){
      const c = f.commandData;
      if (f.dir === 1) return { x:f.x + f.w - 4, y:f.y + c.yOffset, w:c.range, h:c.height };
      return { x:f.x - c.range + 4, y:f.y + c.yOffset, w:c.range, h:c.height };
    }

    let range = 0, height = 0, yOffset = 0;
    if (f.attackType === "punch") { range = 34; height = 24; yOffset = 38; }
    if (f.attackType === "kick") { range = 54; height = 32; yOffset = 68; }
    if (f.attackType === "special") { range = 112; height = 42; yOffset = 24; }
    if (f.attackType === "burst") { range = 138; height = 54; yOffset = 16; }
    if (f.dir === 1) return { x:f.x + f.w - 4, y:f.y + yOffset, w:range, h:height };
    return { x:f.x - range + 4, y:f.y + yOffset, w:range, h:height };
  }

  function attackActiveFrame(f){
    if (f.attackType === "command" && f.commandData){
      const elapsed = f.commandData.timer - f.attackTimer;
      return elapsed >= f.commandData.activeStart && elapsed <= f.commandData.activeEnd;
    }
    if (f.attackType === "punch") return f.attackTimer >= 5 && f.attackTimer <= 7;
    if (f.attackType === "kick") return f.attackTimer >= 8 && f.attackTimer <= 12;
    if (f.attackType === "special") return f.attackTimer >= 9 && f.attackTimer <= 18;
    if (f.attackType === "burst") return f.attackTimer >= 12 && f.attackTimer <= 24;
    return false;
  }

  function gainSuper(f, val){
    f.super = clamp(f.super + val * f.superGain, 0, f.maxSuper);
  }

  function spawnAuraBurst(x, y, color){
    for (let i = 0; i < 16; i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*8,
        vy:(Math.random()-0.5)*6 - 1,
        life:18 + Math.random()*10,
        size:2 + Math.random()*4,
        color
      });
    }
  }

  function spawnProjectile(owner, options = {}){
    const base = owner.characterKey === "phoenix"
      ? { color:"#ffb066", size:17, speed:7.6 }
      : owner.characterKey === "shadow"
        ? { color:"#c4b4ff", size:15, speed:7.3 }
        : owner.characterKey === "blade"
          ? { color:"#91dcff", size:15, speed:8.0 }
          : owner.characterKey === "valkyrie"
            ? { color:"#86ffe8", size:15, speed:7.6 }
            : { color:"#ffd07f", size:16, speed:7.2 };

    projectiles.push({
      owner: owner.isPlayer ? "player" : "enemy",
      x: owner.dir === 1 ? owner.x + owner.w + 6 : owner.x - 6,
      y: owner.y + (options.yOffset || 44),
      vx: (options.speed || base.speed) * owner.dir,
      r: options.size || base.size,
      damage: options.damage || attackData("projectile").damage * owner.atkMul,
      kb: options.kb || attackData("projectile").kb,
      color: options.color || base.color,
      life: options.life || 120
    });

    spawnAuraBurst(owner.x + owner.w/2, owner.y + 40, owner.aura);
  }

  function tryStartAttack(f, type){
    if (f.dead || f.hitstun > 0) return false;
    if (f.attackTimer > 0 || f.attackCooldown > 0) return false;

    const data = attackData(type);
    f.attackType = type;
    f.commandData = null;
    f.attackTimer = data.timer;
    f.attackCooldown = data.cooldown;
    f.hasHit = false;

    if (f.isPlayer){
      if (type === "special") showMessage(CHARACTERS[f.characterKey].specialName, 500);
      if (type === "burst") showMessage(CHARACTERS[f.characterKey].burstName, 700);
    }
    return true;
  }

  function startCommandMove(f, cfg){
    if (f.dead || f.hitstun > 0) return false;
    if (f.attackTimer > 0 || f.attackCooldown > 0) return false;
    f.attackType = "command";
    f.commandData = { ...cfg };
    f.attackTimer = cfg.timer;
    f.attackCooldown = cfg.cooldown;
    f.hasHit = false;
    if (cfg.vx) f.vx = cfg.vx * f.dir;
    if (cfg.vy){
      f.vy = cfg.vy;
      f.onGround = false;
    }
    spawnAuraBurst(f.x + f.w/2, f.y + 40, f.aura);
    return true;
  }

  async function triggerAwaken(f){
    if (f.awakened) return;
    f.awakened = true;
    f.speed += 0.4;
    f.atkMul *= 1.12;
    showMessage(f.isPlayer ? "AWAKENING" : "ENEMY AWAKEN", 700);
    spawnAuraBurst(f.x + f.w/2, f.y + 36, f.aura);
  }

  function updateAwaken(f){
    const hpRate = f.hp / f.maxHp;
    f.awaken = clamp((1 - hpRate - 0.65) / 0.35, 0, 1);
    if (!f.awakened && hpRate <= 0.35) triggerAwaken(f);
  }

  async function finishMatch(attackerIsPlayer, reasonText){
    if (gameOver) return;
    if (musou.active && attackerIsPlayer) return advanceMusouRound();

    gameOver = true;
    const winner = attackerIsPlayer ? player : enemy;
    winner.winPose = 1;
    showMessage(attackerIsPlayer ? "YOU WIN" : "YOU LOSE", 1200);
    await playVictoryCutin(winner);

    if (gameMode === "musou"){
      saveLocalRanking(musou.score, "musou");
      showResultScreen(attackerIsPlayer ? "MUSOU CLEAR" : "MUSOU END", `${reasonText} / 撃破数 ${musou.wins} / SCORE ${musou.score}`);
      return;
    }

    if (attackerIsPlayer && !resultSaved){
      resultSaved = true;
      const score = Math.max(0, Math.floor(player.hp * 100 + roundTimer * 10 + combo * 30));
      saveLocalRanking(score, "battle");
    }

    showResultScreen(attackerIsPlayer ? "YOU WIN" : "YOU LOSE", reasonText);
  }

  function applyDamage(attacker, target, type, overrideDamage = null, overrideKb = null){
    const data = attackData(type);
    const damage = overrideDamage ?? (data.damage * attacker.atkMul / target.defMul);
    const kb = overrideKb ?? data.kb;

    target.hp = clamp(target.hp - damage, 0, target.maxHp);
    target.hurtFlash = 8;
    target.hitstun = (type === "burst" || type === "special" || type === "command") ? 18 : 10;
    target.invuln = (type === "burst" || type === "special" || type === "command") ? 14 : 8;
    target.x += kb * (attacker.dir === 1 ? 1 : -1);
    target.vx = kb * 0.16 * (attacker.dir === 1 ? 1 : -1);
    gainSuper(attacker, data.superGain || 5);
    gainSuper(target, 4);
    attacker.hasHit = true;

    spawnImpact(target.x + target.w/2, target.y + 38, "#ffffff", type === "burst" ? 16 : 8);
    cameraShake = Math.max(cameraShake, type === "burst" ? 12 : (type === "special" || type === "command") ? 8 : 4);

    if (attacker.isPlayer){
      const now = nowMs();
      combo = (now - lastHitTime < 1200) ? combo + 1 : 1;
      lastHitTime = now;
      comboText.textContent = "COMBO " + combo;
    }

    if (target.hp <= 0){
      target.dead = true;
      finishMatch(attacker.isPlayer, "KO");
    }
  }

  function resolveAttackHit(attacker, target){
    if (!attacker.attackType || attacker.hasHit) return;
    if (!attackActiveFrame(attacker)) return;
    if (target.invuln > 0) return;
    const atk = getAttackRect(attacker);
    const body = { x:target.x, y:target.y, w:target.w, h:target.h };
    if (rectsOverlap(atk, body)){
      if (attacker.attackType === "command" && attacker.commandData){
        applyDamage(attacker, target, "command", attacker.commandData.damage * attacker.atkMul / target.defMul, attacker.commandData.kb);
      } else {
        applyDamage(attacker, target, attacker.attackType);
      }
    }
  }

  function resolveProjectiles(){
    projectiles.forEach(p => {
      p.x += p.vx;
      p.life--;

      const target = p.owner === "player" ? enemy : player;
      const pseudo = p.owner === "player" ? player : enemy;
      const rect = { x:p.x - p.r/2, y:p.y - p.r/2, w:p.r, h:p.r };
      const body = { x:target.x, y:target.y, w:target.w, h:target.h };
      if (target.invuln <= 0 && rectsOverlap(rect, body)){
        applyDamage(pseudo, target, "projectile", p.damage / target.defMul, p.kb);
        p.life = 0;
      }
      if (p.x < -40 || p.x > canvas.width + 40) p.life = 0;
    });
    projectiles = projectiles.filter(p => p.life > 0);
  }

  function updateParticles(){
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= 1;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function updateCommonState(f, dt, opponent){
    if (f.dead) return;
    facingUpdate(f, opponent);
    updateAwaken(f);
    f.animPhase += dt * 0.006;
    if (Math.abs(f.vx) > 0.5 && f.onGround) f.runPhase += dt * 0.018;
    if (f.invuln > 0) f.invuln--;
    if (f.hitstun > 0) f.hitstun--;
    if (f.attackCooldown > 0) f.attackCooldown--;
    if (f.hurtFlash > 0) f.hurtFlash--;
    f.crouching = false;

    if (f.attackTimer > 0){
      f.attackTimer--;
      if (f.attackTimer === 0){
        f.attackType = "";
        f.commandData = null;
        f.hasHit = false;
      }
    }
  }

  function recordToken(token){
    const t = nowMs();
    inputBuffer.push({ token, time:t });
    inputBuffer = inputBuffer.filter(v => t - v.time <= 800).slice(-14);
  }

  function matchPattern(pattern){
    const recent = inputBuffer.filter(v => nowMs() - v.time <= 800);
    if (pattern.length === 1) return recent.length && recent[recent.length - 1].token === pattern[0];
    if (recent.length < pattern.length) return false;

    for (let start = Math.max(0, recent.length - pattern.length - 2); start <= recent.length - pattern.length; start++){
      let ok = true;
      for (let i = 0; i < pattern.length; i++){
        if (recent[start + i].token !== pattern[i]) {
          ok = false;
          break;
        }
      }
      if (ok) return true;
    }
    return false;
  }

  function consumeMatchedPattern(){
    inputBuffer = [];
  }

  function checkPlayerCommandTrigger(opponent){
    const cmds = CHARACTERS[player.characterKey].commands;
    for (let i = 0; i < cmds.length; i++){
      const c = cmds[i];
      if (matchPattern(c.pattern)){
        if (performCharacterCommand(player, c, opponent)) return true;
      }
    }
    return false;
  }

  function updateFighterByInput(f, input, dt, opponent){
    updateCommonState(f, dt, opponent);
    if (f.dead) return;

    const spd = f.speed + (f.awakened ? 0.35 : 0);

    if (f.hitstun <= 0 && f.attackTimer <= 0){
      if (input.down && f.onGround){
        f.crouching = true;
        f.vx *= 0.55;
      } else if (input.left && !input.right) {
        f.vx = -spd;
      } else if (input.right && !input.left) {
        f.vx = spd;
      } else {
        f.vx *= 0.72;
      }

      if (input.jump && f.onGround && !input.down){
        f.vy = -(f.jumpPower + (f.awakened ? 0.5 : 0));
        f.onGround = false;
      }

      if (input.punch) tryStartAttack(f, "punch");
      if (input.kick) tryStartAttack(f, "kick");
      if (input.special){
        if (f.super >= 100) tryStartAttack(f, "burst");
        else tryStartAttack(f, "special");
      }
    } else if (f.hitstun > 0){
      f.vx *= 0.9;
    }

    f.vy += gravity;
    f.x += f.vx;
    f.y += f.vy;

    if (f.y >= groundY() - f.h){
      f.y = groundY() - f.h;
      f.vy = 0;
      f.onGround = true;
    } else {
      f.onGround = false;
    }

    f.x = clamp(f.x, 16, canvas.width - f.w - 16);
  }

  function updatePlayerOffline(dt){
    const commandTriggered = checkPlayerCommandTrigger(enemy);
    updateFighterByInput(player, {
      left:keys.left,
      right:keys.right,
      down:keys.down,
      jump:keys.jump,
      punch:commandTriggered ? false : pressedThisFrame.punch,
      kick:commandTriggered ? false : pressedThisFrame.kick,
      special:commandTriggered ? false : pressedThisFrame.special
    }, dt, enemy);
  }

  function updateEnemyAI(dt){
    updateCommonState(enemy, dt, player);
    if (enemy.dead) return;

    if (enemy.hitstun <= 0 && enemy.attackTimer <= 0){
      const d = Math.abs((enemy.x + enemy.w/2) - (player.x + player.w/2));
      const diff = difficultySelect.value;
      const baseSpeed = diff === "boss" ? 5.8 : diff === "god" ? 5.15 : diff === "hard" ? 4.45 : 3.9;

      if (d > 150) enemy.vx = enemy.dir === 1 ? baseSpeed : -baseSpeed;
      else if (d < 72) enemy.vx = enemy.dir === 1 ? -baseSpeed * 0.9 : baseSpeed * 0.9;
      else enemy.vx *= 0.6;

      if (enemy.onGround && Math.random() < 0.004 && d > 100 && d < 240){
        enemy.vy = -enemy.jumpPower * 0.95;
        enemy.onGround = false;
      }

      const react = diff === "boss" ? 1.0 : diff === "god" ? 0.93 : diff === "hard" ? 0.80 : 0.62;
      if (enemy.super >= 100 && d < 160 && Math.random() < 0.010 * react) tryStartAttack(enemy, "burst");
      else if (d > 120 && d < 240 && Math.random() < 0.018 * react) spawnProjectile(enemy);
      else if (enemy.super >= 50 && d < 150 && Math.random() < 0.016 * react) tryStartAttack(enemy, "special");
      else if (d < 82 && Math.random() < 0.030 * react) tryStartAttack(enemy, "punch");
      else if (d < 112 && Math.random() < 0.024 * react) tryStartAttack(enemy, "kick");
    } else if (enemy.hitstun > 0){
      enemy.vx *= 0.9;
    }

    enemy.vy += gravity;
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;

    if (enemy.y >= groundY() - enemy.h){
      enemy.y = groundY() - enemy.h;
      enemy.vy = 0;
      enemy.onGround = true;
    } else enemy.onGround = false;

    enemy.x = clamp(enemy.x, 16, canvas.width - enemy.w - 16);
  }

  function resolvePush(){
    const a = { x:player.x, y:player.y, w:player.w, h:player.h };
    const b = { x:enemy.x, y:enemy.y, w:enemy.w, h:enemy.h };
    if (!rectsOverlap(a,b)) return;
    const centerA = a.x + a.w / 2;
    const centerB = b.x + b.w / 2;
    const overlap = (a.w / 2 + b.w / 2) - Math.abs(centerA - centerB);
    if (overlap > 0){
      const dir = centerA < centerB ? -1 : 1;
      player.x += dir * overlap / 2;
      enemy.x -= dir * overlap / 2;
      player.x = clamp(player.x, 16, canvas.width - player.w - 16);
      enemy.x = clamp(enemy.x, 16, canvas.width - enemy.w - 16);
    }
  }

  async function playVictoryCutin(fighter){
    cutinName.textContent = fighter.name;
    cutinArt.style.setProperty("--cutinColor", fighter.aura);
    cutinOverlay.classList.add("show");
    await delay(1000);
    cutinOverlay.classList.remove("show");
  }

  async function advanceMusouRound(){
    musou.wins += 1;
    const gain = Math.floor(400 + musou.wins * 120 + player.hp * 8);
    musou.score += gain;
    musou.wave += 1;
    enemy = createFighter(pickEnemyCharacter(), false);
    enemy.maxHp = Math.min(150, 100 + musou.wins * 7);
    enemy.hp = enemy.maxHp;
    enemy.atkMul *= 1 + musou.wins * 0.03;
    enemy.defMul *= 1 + musou.wins * 0.02;
    player.x = 120;
    player.y = groundY() - player.h;
    player.vx = 0;
    player.vy = 0;
    player.dead = false;
    player.hitstun = 0;
    player.invuln = 30;
    player.super = clamp(player.super + 22, 0, 100);
    roundTimer = 60;
    combo = 0;
    comboText.textContent = "COMBO 0";
    difficultyText.textContent = `MUSOU W${musou.wave}`;
    rightName.textContent = enemy.name;
    showMessage(`WAVE ${musou.wave} +${gain}`, 1000);
  }

  function updateGame(dt){
    if (gameOver) return;

    roundTimer -= dt / 1000;
    if (roundTimer < 0) roundTimer = 0;

    centerInfo.textContent = musou.active
      ? `W${musou.wave} / ${Math.ceil(roundTimer)} / ${musou.score}`
      : `${STAGES[stageSelect.value].label} / ${Math.ceil(roundTimer)}`;

    updatePlayerOffline(dt);
    updateEnemyAI(dt);

    resolvePush();
    resolveAttackHit(player, enemy);
    resolveAttackHit(enemy, player);
    resolveProjectiles();
    updateParticles();

    if (performance.now() - lastHitTime > 1300 && combo !== 0){
      combo = 0;
      comboText.textContent = "COMBO 0";
    }

    if (!gameOver && roundTimer <= 0){
      if (musou.active){
        finishMatch(false, "TIME UP");
      } else {
        if (player.hp >= enemy.hp) finishMatch(true, "TIME UP");
        else finishMatch(false, "TIME UP");
      }
    }

    Object.keys(pressedThisFrame).forEach(k => pressedThisFrame[k] = false);
  }

  function loop(now){
    const dt = Math.min(32, now - lastTime);
    lastTime = now;
    if (!gameRunning) return;
    updateGame(dt);
    render();
    animationId = requestAnimationFrame(loop);
  }

  function drawBackground(){
    const st = STAGES[stageSelect.value];
    const horizon = canvas.height * 0.56;
    const grad = ctx.createLinearGradient(0, 0, 0, horizon);
    grad.addColorStop(0, st.skyTop);
    grad.addColorStop(1, st.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, horizon);

    if (stageSelect.value === "neon"){
      for (let i = 0; i < 12; i++){
        ctx.fillStyle = i % 2 ? "rgba(116,196,255,.12)" : "rgba(255,90,180,.08)";
        ctx.fillRect(i * (canvas.width/12), 42 + (i%3)*14, 44, horizon - 100 - (i%4)*18);
      }
    } else if (stageSelect.value === "moon"){
      ctx.fillStyle = "rgba(255,255,255,.14)";
      ctx.beginPath();
      ctx.arc(canvas.width * 0.82, 92, 42, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.04)";
      for (let i = 0; i < 8; i++){
        const bw = 84 + (i % 3) * 44;
        const bh = 90 + (i % 4) * 24;
        const bx = i * (canvas.width / 8);
        const by = horizon - bh;
        ctx.fillRect(bx, by, bw, bh);
      }
    }

    ctx.fillStyle = st.floor;
    ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);
    ctx.fillStyle = st.line;
    for (let i = 0; i < canvas.width; i += 76) ctx.fillRect(i, horizon + 28, 44, 3);
  }

  function drawAura(f, x, y){
    const active = f.super >= 50 || f.awakened;
    if (!active) return;
    const pulse = 0.65 + Math.sin(performance.now() * 0.01 + f.animPhase) * 0.08;
    ctx.save();
    ctx.globalAlpha = f.awakened ? 0.24 : 0.12;
    ctx.fillStyle = f.aura;
    ctx.beginPath();
    ctx.ellipse(x + f.w/2, y + f.h/2, (f.awakened ? 36 : 26) * pulse, (f.awakened ? 64 : 52) * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function getIdleProfile(f, t){
    const s1 = Math.sin(t);
    const s2 = Math.sin(t * 2.1 + 0.6);
    const s3 = Math.sin(t * 0.55 + 1.4);
    const c1 = Math.cos(t * 0.9 + 0.3);

    const profiles = {
      karate: {
        bodyBob: s1 * 2.0 + s2 * .6,
        hipShift: s3 * 2.0,
        shoulderShift: -s3 * 1.6,
        headTilt: s2 * 0.05,
        frontArmX: 11 + s1 * 2.5,
        frontArmY: -3 + s2 * 1.5,
        backArmX: -9 + s3 * 1.5,
        backArmY: 12 + c1 * 1.4,
        frontLegX: 12,
        backLegX: -10,
        frontLegY: 0,
        backLegY: 0,
        crouchExtra: 0,
        clothSwing: s1 * 8,
        hairSwing: s2 * 2
      },
      boxer: {
        bodyBob: s1 * 1.8 + s2 * 1.1,
        hipShift: s2 * 2.4,
        shoulderShift: s1 * 3.0,
        headTilt: s1 * 0.08,
        frontArmX: 18 + s2 * 3.4,
        frontArmY: -6 + s1 * 2.4,
        backArmX: -16 + s1 * 2.0,
        backArmY: 3 + s2 * 1.8,
        frontLegX: 14 + s1 * .6,
        backLegX: -12 - s1 * .6,
        frontLegY: s2 * .8,
        backLegY: -s2 * .8,
        crouchExtra: 1.5,
        clothSwing: s2 * 5,
        hairSwing: s1 * 3
      },
      power: {
        bodyBob: s1 * 1.1,
        hipShift: s3 * 1.2,
        shoulderShift: s1 * 1.0,
        headTilt: s2 * 0.03,
        frontArmX: 14 + s2 * 1.2,
        frontArmY: 6 + s1 * .8,
        backArmX: -13 + s3 * .8,
        backArmY: 8 + s2 * .8,
        frontLegX: 13,
        backLegX: -11,
        frontLegY: 0,
        backLegY: 0,
        crouchExtra: 2.5,
        clothSwing: s1 * 3,
        hairSwing: s2 * 1
      },
      ninja: {
        bodyBob: s1 * 1.5 + s2 * .9,
        hipShift: s1 * 1.8,
        shoulderShift: -s1 * 2.1,
        headTilt: s2 * 0.06,
        frontArmX: 20 + s1 * 2.5,
        frontArmY: 2 + s2 * 1.2,
        backArmX: -18 + s2 * 2.5,
        backArmY: 7 + s1 * 1.0,
        frontLegX: 14,
        backLegX: -14,
        frontLegY: s1 * 1.0,
        backLegY: -s1 * 1.0,
        crouchExtra: 4.0,
        clothSwing: s1 * 9,
        hairSwing: s2 * 2
      },
      lancer: {
        bodyBob: s1 * 1.6,
        hipShift: s2 * 1.4,
        shoulderShift: s3 * 1.8,
        headTilt: s2 * 0.04,
        frontArmX: 13 + s1 * 1.3,
        frontArmY: -1 + s2 * 1.0,
        backArmX: -12 + s3 * 1.0,
        backArmY: 11 + s1 * 1.2,
        frontLegX: 11,
        backLegX: -10,
        frontLegY: 0,
        backLegY: 0,
        crouchExtra: .4,
        clothSwing: s1 * 6,
        hairSwing: s2 * 2
      },
      wild: {
        bodyBob: s1 * 2.4 + s2 * 1.0,
        hipShift: s2 * 2.2,
        shoulderShift: s1 * 2.8,
        headTilt: s1 * 0.07,
        frontArmX: 16 + s2 * 2.4,
        frontArmY: 3 + s1 * 2.0,
        backArmX: -13 + s3 * 1.7,
        backArmY: 10 + s2 * 1.2,
        frontLegX: 13,
        backLegX: -12,
        frontLegY: s2 * .6,
        backLegY: -s2 * .6,
        crouchExtra: 1.0,
        clothSwing: s1 * 10,
        hairSwing: s2 * 4
      }
    };

    return profiles[f.idleType] || profiles.karate;
  }

  function drawHead(f, cx, headY, hairSwing, headTilt){
    ctx.save();
    ctx.translate(cx, headY);
    ctx.rotate(headTilt);

    ctx.fillStyle = f.skin;
    ctx.beginPath();
    ctx.arc(0, 0, f.build === "heavy" ? 16 : 15, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = f.hair;
    if (f.characterKey === "ryu"){
      ctx.beginPath();
      ctx.arc(0, -3, 15, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = f.band;
      ctx.fillRect(-16, -2, 32, 4);
    } else if (f.characterKey === "blade"){
      ctx.beginPath();
      ctx.moveTo(-15, -4);
      ctx.lineTo(16 + hairSwing, -12);
      ctx.lineTo(9, 1);
      ctx.lineTo(-14, 3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = f.band;
      ctx.fillRect(-15, -1, 30, 3);
    } else if (f.characterKey === "titan"){
      ctx.beginPath();
      ctx.arc(0, -3, 16, Math.PI, 0);
      ctx.fill();
    } else if (f.characterKey === "shadow"){
      ctx.beginPath();
      ctx.arc(0, -4, 16, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#0a0a10";
      ctx.fillRect(-11, 1, 22, 8);
    } else if (f.characterKey === "valkyrie"){
      ctx.beginPath();
      ctx.moveTo(-12, -5);
      ctx.lineTo(12, -5);
      ctx.lineTo(6, 5);
      ctx.lineTo(-6, 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = f.band;
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(6, -4);
      ctx.lineTo(-6, -4);
      ctx.closePath();
      ctx.fill();
    } else if (f.characterKey === "phoenix"){
      ctx.beginPath();
      ctx.moveTo(-14, 2);
      ctx.lineTo(-8, -10 - hairSwing * .3);
      ctx.lineTo(0, -4);
      ctx.lineTo(8, -12 + hairSwing * .3);
      ctx.lineTo(14, 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = f.band;
      ctx.fillRect(-14, -1, 28, 3);
    }

    ctx.fillStyle = "#101624";
    if (f.face === "mask"){
      ctx.fillRect(-8, 0, 16, 2);
    } else if (f.face === "cool"){
      ctx.fillRect(-7, -1, 4, 2);
      ctx.fillRect(3, -2, 4, 1.5);
    } else if (f.face === "power"){
      ctx.fillRect(-8, -1, 5, 2.5);
      ctx.fillRect(3, -1, 5, 2.5);
    } else if (f.face === "wild"){
      ctx.fillRect(-7, -1, 4, 2);
      ctx.fillRect(3, -1, 4, 2);
      ctx.fillRect(-2, 5, 4, 1.4);
    } else {
      ctx.fillRect(-7, -1, 4, 2);
      ctx.fillRect(3, -1, 4, 2);
    }

    ctx.restore();
  }

  function drawFighter(f){
    const x = Math.round(f.x);
    const y = Math.round(f.y);
    const t = performance.now() * 0.004 + f.animPhase;
    const idle = getIdleProfile(f, t);

    const runSwing = Math.sin(f.runPhase) * 10;
    const runSwing2 = Math.sin(f.runPhase + Math.PI) * 10;
    const moving = Math.abs(f.vx) > 0.5 && f.onGround && !f.crouching;
    const crouchOffset = f.crouching ? 10 : 0;
    const winLift = f.winPose ? -8 : 0;

    ctx.save();
    drawAura(f, x, y);
    if (f.hurtFlash > 0) ctx.globalAlpha = 0.82;

    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(x + f.w / 2 + idle.hipShift * .3, groundY() - 3, f.build === "heavy" ? 29 : 24, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    const bodyX = x + 10 + idle.hipShift;
    const bodyY = y + 26 + idle.bodyBob + crouchOffset + winLift + idle.crouchExtra;
    const bodyW = f.w - 20;
    const bodyH = f.h - 48 - crouchOffset;
    const cx = x + f.w/2 + idle.shoulderShift * .4;
    const headY = y + 16 + idle.bodyBob * .9 + crouchOffset * 0.4 + winLift;

    drawHead(f, cx, headY, idle.hairSwing, idle.headTilt);

    ctx.fillStyle = f.hurtFlash > 0 ? "#ffffff" : f.color;
    ctx.strokeStyle = f.accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(bodyX, bodyY, bodyW, bodyH, 14);
    ctx.fill();
    ctx.stroke();

    if (f.characterKey === "ryu"){
      ctx.fillStyle = f.accent;
      ctx.fillRect(bodyX + 4, bodyY + 34, bodyW - 8, 5);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(bodyX + bodyW/2 - 3, bodyY + 10, 6, bodyH - 16);
    } else if (f.characterKey === "blade"){
      ctx.fillStyle = "rgba(255,255,255,.20)";
      ctx.fillRect(bodyX + 5, bodyY + 10, bodyW - 10, 4);
      ctx.fillRect(bodyX + 8, bodyY + 28, bodyW - 16, 4);
      ctx.fillRect(bodyX + 11, bodyY + 46, bodyW - 22, 4);
    } else if (f.characterKey === "titan"){
      ctx.fillStyle = f.accent;
      ctx.fillRect(bodyX + 6, bodyY + 18, bodyW - 12, 10);
      ctx.fillStyle = "#2d1808";
      ctx.fillRect(bodyX + 6, bodyY + 44, bodyW - 12, 14);
    } else if (f.characterKey === "shadow"){
      ctx.fillStyle = "#0a0b14";
      ctx.fillRect(bodyX + 8, bodyY + 14, bodyW - 16, 18);
      ctx.fillStyle = f.accent;
      ctx.fillRect(bodyX + bodyW/2 - 2, bodyY + 10, 4, bodyH - 20);
    } else if (f.characterKey === "valkyrie"){
      ctx.fillStyle = f.accent;
      ctx.fillRect(bodyX + bodyW/2 - 2, bodyY + 8, 4, bodyH - 14);
      ctx.fillStyle = "#f6fbff";
      ctx.fillRect(bodyX + 8, bodyY + 18, bodyW - 16, 7);
    } else if (f.characterKey === "phoenix"){
      ctx.fillStyle = f.accent;
      ctx.beginPath();
      ctx.moveTo(bodyX + 8, bodyY + 14);
      ctx.lineTo(bodyX + bodyW - 8, bodyY + 14);
      ctx.lineTo(bodyX + bodyW/2, bodyY + 30);
      ctx.closePath();
      ctx.fill();
    }

    // 布・帯
    ctx.save();
    ctx.fillStyle = f.accent;
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    ctx.moveTo(bodyX + bodyW/2, bodyY + 26);
    ctx.quadraticCurveTo(bodyX + bodyW/2 - 18 * f.dir, bodyY + 42, bodyX + bodyW/2 + idle.clothSwing * .35, bodyY + 62 + idle.clothSwing * .12);
    ctx.lineTo(bodyX + bodyW/2 + 8 * f.dir, bodyY + 32);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    const shoulderY = y + 54 + idle.bodyBob + crouchOffset + winLift + idle.shoulderShift * .25;
    const legY = y + f.h - 28 + winLift;
    const footY = y + f.h - 2 + winLift;
    const forward = f.dir === 1 ? 1 : -1;

    const frontArmOffset = moving ? runSwing * 0.45 : idle.frontArmX;
    const backArmOffset = moving ? runSwing2 * 0.45 : -idle.backArmX;
    const frontArmY = moving ? 11 : idle.frontArmY;
    const backArmY = moving ? 11 : idle.backArmY;

    const frontLegX = moving ? 10 + frontLegOffsetHelper(runSwing) : idle.frontLegX;
    const backLegX = moving ? -10 + backLegOffsetHelper(runSwing2) : idle.backLegX;
    const frontLegY = moving ? 0 : idle.frontLegY;
    const backLegY = moving ? 0 : idle.backLegY;

    ctx.strokeStyle = f.accent;
    ctx.lineWidth = f.build === "heavy" ? 9 : 7;
    ctx.lineCap = "round";

    // front arm
    ctx.beginPath();
    ctx.moveTo(cx, shoulderY);
    if (f.winPose){
      if (f.characterKey === "phoenix") ctx.lineTo(cx + 26 * forward, shoulderY - 30);
      else if (f.characterKey === "titan") ctx.lineTo(cx + 20 * forward, shoulderY - 18);
      else ctx.lineTo(cx + 22 * forward, shoulderY - 24);
    } else if (f.attackTimer > 0){
      const len = f.attackType === "punch" ? 34 :
        f.attackType === "kick" ? 20 :
        f.attackType === "burst" ? 62 :
        f.attackType === "command" && f.commandData ? Math.min(70, f.commandData.range * 0.7) : 54;
      const rise = f.attackType === "special" ? -10 : f.attackType === "burst" ? -18 : -2;
      ctx.lineTo(cx + len * forward, shoulderY + rise);
    } else {
      ctx.lineTo(cx + frontArmOffset * forward, shoulderY + frontArmY);
    }
    ctx.stroke();

    // back arm
    ctx.beginPath();
    ctx.moveTo(cx, shoulderY);
    if (f.winPose){
      if (f.characterKey === "ryu") ctx.lineTo(cx - 14 * forward, shoulderY + 16);
      else if (f.characterKey === "blade") ctx.lineTo(cx - 6 * forward, shoulderY + 22);
      else ctx.lineTo(cx - 10 * forward, shoulderY + 18);
    } else {
      ctx.lineTo(cx - Math.abs(backArmOffset) * forward, shoulderY + backArmY);
    }
    ctx.stroke();

    // front leg
    ctx.beginPath();
    ctx.moveTo(cx, legY - crouchOffset);
    if (f.winPose){
      if (f.characterKey === "blade") ctx.lineTo(cx + 20 * forward, footY - 12);
      else ctx.lineTo(cx + 16 * forward, footY - 4);
    } else if (f.attackTimer > 0 && (f.attackType === "kick" || (f.attackType === "command" && f.commandData && f.commandData.yOffset > 35))){
      ctx.lineTo(cx + 42 * forward, legY + 2 - crouchOffset);
    } else {
      ctx.lineTo(cx + frontLegX, footY + frontLegY);
    }
    ctx.stroke();

    // back leg
    ctx.beginPath();
    ctx.moveTo(cx, legY - crouchOffset);
    if (f.winPose){
      if (f.characterKey === "titan") ctx.lineTo(cx - 4 * forward, footY + 2);
      else ctx.lineTo(cx - 8 * forward, footY);
    } else {
      ctx.lineTo(cx + backLegX, footY + backLegY);
    }
    ctx.stroke();

    // Valkyrie lance
    if (f.characterKey === "valkyrie"){
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      const lanceY1 = shoulderY - 6 + idle.clothSwing * 0.12;
      const lanceY2 = shoulderY - 34 + idle.clothSwing * 0.18;
      ctx.moveTo(cx + 12 * forward, lanceY1);
      ctx.lineTo(cx + 54 * forward, lanceY2);
      ctx.stroke();
    }

    if (["special","burst","command"].includes(f.attackType)){
      const atk = getAttackRect(f);
      ctx.fillStyle = f.attackType === "burst" ? "rgba(255,255,255,.18)" : f.attackType === "command" ? "rgba(255,255,255,.12)" : "rgba(255,210,77,.18)";
      ctx.strokeStyle = f.attackType === "burst" ? "rgba(255,255,255,.92)" : "rgba(255,230,166,.72)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(atk.x, atk.y, atk.w, atk.h, 18);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  function frontLegOffsetHelper(v){ return v * 0.35; }
  function backLegOffsetHelper(v){ return v * 0.35; }

  function drawProjectiles(){
    projectiles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = 0.26;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.52, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 0.8, p.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.restore();
    });
  }

  function drawParticles(){
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 28);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawHud(){
    playerHpBar.style.width = ((player.hp / player.maxHp) * 100) + "%";
    enemyHpBar.style.width = ((enemy.hp / enemy.maxHp) * 100) + "%";
    playerSuperBar.style.width = ((player.super / player.maxSuper) * 100) + "%";
    enemySuperBar.style.width = ((enemy.super / enemy.maxSuper) * 100) + "%";
    playerAwakenBar.style.width = (player.awaken * 100) + "%";
    enemyAwakenBar.style.width = (enemy.awaken * 100) + "%";
    playerHpText.textContent = `HP ${Math.ceil(player.hp)} / ${player.maxHp}`;
    enemyHpText.textContent = musou.active ? `S ${musou.score}` : `HP ${Math.ceil(enemy.hp)} / ${enemy.maxHp}`;
  }

  function render(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const shakeX = cameraShake > 0 ? (Math.random() - 0.5) * cameraShake : 0;
    const shakeY = cameraShake > 0 ? (Math.random() - 0.5) * cameraShake : 0;
    const scale = parseFloat(getComputedStyle(root).getPropertyValue("--gameScale")) || 1;

    ctx.save();
    ctx.translate(shakeX, shakeY);

    if (scale !== 1){
      const topMargin = 8;
      ctx.translate((canvas.width - canvas.width * scale) / 2, topMargin);
      ctx.scale(scale, scale);
    }

    drawBackground();
    drawFighter(player);
    drawFighter(enemy);
    drawProjectiles();
    drawParticles();
    ctx.restore();

    if (cameraShake > 0) cameraShake *= 0.82;
    if (cameraShake < 0.3) cameraShake = 0;
    drawHud();
  }

  function setKeyFromCode(code, pressed){
    if (code === "ArrowLeft"){
      keys.left = pressed;
      if (pressed) recordToken("L");
    }
    if (code === "ArrowRight"){
      keys.right = pressed;
      if (pressed) recordToken("R");
    }
    if (code === "ArrowDown"){
      keys.down = pressed;
      if (pressed) recordToken("D");
    }
    if (code === "ArrowUp"){
      keys.jump = pressed;
      if (pressed) recordToken("U");
    }
    if (code === "KeyZ"){
      if (pressed){
        pressedThisFrame.punch = true;
        recordToken("P");
      }
      keys.punch = pressed;
    }
    if (code === "KeyX"){
      if (pressed){
        pressedThisFrame.kick = true;
        recordToken("K");
      }
      keys.kick = pressed;
    }
    if (code === "KeyC"){
      if (pressed){
        pressedThisFrame.special = true;
        recordToken("S");
      }
      keys.special = pressed;
    }
  }

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","KeyZ","KeyX","KeyC","Space"].includes(e.code)) e.preventDefault();
    setKeyFromCode(e.code, true);
  }, { passive:false });

  window.addEventListener("keyup", (e) => setKeyFromCode(e.code, false));

  function bindTouchButton(el, keyName, token = null){
    const press = (e) => {
      if (e) e.preventDefault();
      keys[keyName] = true;
      if (keyName === "punch") pressedThisFrame.punch = true;
      if (keyName === "kick") pressedThisFrame.kick = true;
      if (keyName === "special") pressedThisFrame.special = true;
      if (token) recordToken(token);
      el.classList.add("active");
    };

    const release = (e) => {
      if (e) e.preventDefault();
      keys[keyName] = false;
      el.classList.remove("active");
    };

    el.addEventListener("pointerdown", press, { passive:false });
    el.addEventListener("pointerup", release, { passive:false });
    el.addEventListener("pointercancel", release, { passive:false });
    el.addEventListener("pointerleave", release, { passive:false });

    el.addEventListener("touchstart", press, { passive:false });
    el.addEventListener("touchend", release, { passive:false });
    el.addEventListener("touchcancel", release, { passive:false });

    el.addEventListener("mousedown", press, { passive:false });
    el.addEventListener("mouseup", release, { passive:false });
    el.addEventListener("mouseleave", release, { passive:false });
  }

  bindTouchButton(touchButtons.left, "left", "L");
  bindTouchButton(touchButtons.right, "right", "R");
  bindTouchButton(touchButtons.down, "down", "D");
  bindTouchButton(touchButtons.jump, "jump", "U");
  bindTouchButton(touchButtons.punch, "punch", "P");
  bindTouchButton(touchButtons.kick, "kick", "K");
  bindTouchButton(touchButtons.special, "special", "S");

    resetBattle();

    canvas.style.display = "block";

    lastTime = performance.now();

    applyViewportSafeLayout();

  };

  helpBtn.onclick = () => {
    setHelpText();
    clearScreens();
    helpScreen.classList.add("show");
  };

  helpBackBtn.onclick = () => {
    clearScreens();
    menuScreen.classList.add("show");
  };

  characterBtn.onclick = () => {
    renderCharacterCards();
    clearScreens();
    characterScreen.classList.add("show");
  };

  characterBackBtn.onclick = () => {
    clearScreens();
    menuScreen.classList.add("show");
  };

  rankingBackBtn.onclick = () => {
    clearScreens();
    menuScreen.classList.add("show");
  };

  rankBattleBtn.onclick = () => {
    rankingModeFilter = "battle";
    loadLocalRanking();
  };

  rankMusouBtn.onclick = () => {
    rankingModeFilter = "musou";
    loadLocalRanking();
  };

  rankingResetBtn.onclick = resetLocalRanking;
  rematchBtn.onclick = rematchLastBattle;
  resultMenuBtn.onclick = returnToMenu;
  fullscreenBtn.onclick = enterFullscreenIfPossible;
  gameFullscreenBtn.onclick = enterFullscreenIfPossible;
  backMenuBtn.onclick = returnToMenu;

  playerNameInput.addEventListener("change", saveNameLocal);
  playerNameInput.addEventListener("blur", saveNameLocal);

  fitCanvas();
  applyViewportSafeLayout();
  renderCharacterCards();
  renderMenuCommands();
  setHelpText();
  loadNameLocal();

  window.addEventListener("resize", () => {
    fitCanvas();
    applyViewportSafeLayout();
    setGameUiState(gameRunning);
    updateRotateNotice();
  });

  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      fitCanvas();
      applyViewportSafeLayout();
      setGameUiState(gameRunning);
      updateRotateNotice();
    }, 250);
  });

  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", () => {
      fitCanvas();
      applyViewportSafeLayout();
      setGameUiState(gameRunning);
      updateRotateNotice();
    });
  }

  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  document.addEventListener("touchstart", (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });

  document.addEventListener("touchmove", (e) => {
    if (e.scale && e.scale !== 1) e.preventDefault();
    if (gameRunning && e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });

  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive:false });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("selectstart", (e) => e.preventDefault());
  document.addEventListener("dragstart", (e) => e.preventDefault());

  clearScreens();
  menuScreen.classList.add("show");
  setGameUiState(false);
})();
</script>
</body>
</html>
