<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>格闘ゲーム</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root{
      --bg1:#0a1021;
      --bg2:#17284b;
      --bg3:#070b14;
      --panel:rgba(8,12,22,.92);
      --line:rgba(255,255,255,.12);
      --text:#eef3ff;
      --muted:#a9b6d8;
      --red1:#ff6b7a;
      --red2:#c9344f;
      --blue1:#67b7ff;
      --blue2:#306eff;
      --gold1:#ffe38a;
      --gold2:#ffb300;
      --green1:#60ecb3;
      --green2:#18af7b;
      --vio1:#c58cff;
      --vio2:#7f47ff;
      --shadow:0 18px 50px rgba(0,0,0,.44);
      --gameScale:.86;
      --hudTop:6px;
      --moveBtn:76px;
      --actionBtn:84px;
      --specialBtn:94px;
      --mobileGap:8px;
    }

    *{
      box-sizing:border-box;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overscroll-behavior:none;
    }

    body{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      touch-action:manipulation;
    }

    body.game-active{ touch-action:none; }

    button, select, input, .card, .touch-btn{ touch-action:manipulation; }
    canvas{ touch-action:none; }

    #app{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(99,145,255,.16), transparent 22%),
        radial-gradient(circle at 80% 10%, rgba(255,120,170,.12), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(90,255,210,.10), transparent 30%),
        linear-gradient(180deg,var(--bg2),var(--bg1) 42%,var(--bg3));
    }

    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:none;
      background:#000;
    }

    .screen{
      position:absolute;
      inset:0;
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:10px;
      padding-top:clamp(12px, 2vh, 20px);
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.06), transparent 34%),
        linear-gradient(180deg, rgba(14,22,42,.92), rgba(0,0,0,.95));
      z-index:70;
      touch-action:pan-y;
    }
    .screen.show{ display:flex; }

    .panel{
      width:min(96vw,1180px);
      max-height:none;
      overflow:visible;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:24px;
      padding:14px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      text-align:center;
      margin:0 auto;
      touch-action:pan-y;
    }

    .menu-panel{
      position:relative;
      overflow:visible;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(circle at 18% 18%, rgba(255,85,110,.20), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(90,180,255,.20), transparent 24%),
        radial-gradient(circle at 50% 85%, rgba(120,255,210,.10), transparent 28%),
        linear-gradient(180deg, rgba(18,28,56,.96), rgba(5,8,18,.96));
    }

    .menu-head{
      position:relative;
      z-index:1;
      margin-bottom:10px;
      padding-top:4px;
    }

    .menu-kicker{
      display:inline-block;
      padding:5px 12px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.16em;
      color:#06131d;
      background:linear-gradient(180deg,#c3f7ff,#67dfff);
      margin-bottom:8px;
    }

    .hero-title{
      font-size:clamp(22px,4.6vw,58px);
      font-weight:1000;
      letter-spacing:.04em;
      margin:0 0 6px;
      line-height:1.05;
      word-break:keep-all;
      background:linear-gradient(90deg,#fff,#9dd8ff,#ffd8df,#fff0a3);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 8px 22px rgba(0,0,0,.35);
    }

    .hero-sub{
      max-width:860px;
      margin:0 auto 10px;
      font-size:13px;
      color:#d0dbf6;
      line-height:1.5;
    }

    .hero-badges{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      margin:8px 0 4px;
    }

    .hero-badge{
      padding:7px 11px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.04em;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
    }

    .menu-grid{
      display:grid;
      grid-template-columns:1.18fr .82fr;
      gap:12px;
      margin-top:10px;
      position:relative;
      z-index:1;
    }

    .menu-col{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:22px;
      padding:14px;
    }

    .menu-btn-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .main-btn{
      min-width:0;
      width:100%;
      min-height:60px;
      border-radius:18px;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.04em;
    }

    .mode-showcase{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      margin-top:10px;
      text-align:left;
    }

    .mode-tile{
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:16px;
      padding:10px;
    }

    .mode-tile h4{ margin:0 0 4px; font-size:13px; }
    .mode-tile p{ margin:0; font-size:11px; color:#c8d4f2; }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      margin-top:8px;
    }

    .info-card{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.035);
      border-radius:18px;
      padding:12px;
      text-align:left;
      margin-top:10px;
    }

    .info-card h3{ margin:0 0 8px; font-size:15px; }

    .command-preview{
      display:grid;
      gap:8px;
      margin-top:8px;
      text-align:left;
    }

    .command-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
    }

    .command-row strong{ font-size:12px; }
    .command-row span{ font-size:11px; color:#c8d5f2; text-align:right; }

    button,select,input{
      border:none;
      outline:none;
      min-width:200px;
      padding:12px 14px;
      border-radius:15px;
      font-size:15px;
      font-weight:900;
      color:#fff;
      box-shadow:var(--shadow);
    }

    button{
      background:linear-gradient(180deg,var(--red1),var(--red2));
      cursor:pointer;
    }

    button.secondary{ background:linear-gradient(180deg,#61718f,#32405c); }
    button.gold{ background:linear-gradient(180deg,var(--gold1),var(--gold2)); color:#2a1800; }
    button.green{ background:linear-gradient(180deg,var(--green1),var(--green2)); color:#04261b; }
    button.violet{ background:linear-gradient(180deg,var(--vio1),var(--vio2)); }
    button.cyan{ background:linear-gradient(180deg,var(--blue1),var(--blue2)); }

    select,input{
      appearance:none;
      background:linear-gradient(180deg,#25324d,#182235);
    }

    input{
      text-align:center;
      text-transform:none;
      letter-spacing:.04em;
    }

    #playerNameInput, #roomCodeInput{
      min-width:0;
      width:100%;
    }

    #roomCodeInput{
      text-transform:uppercase;
      letter-spacing:.14em;
    }

    #roomCodeView{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:56px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      font-size:clamp(22px,4vw,34px);
      font-weight:1000;
      letter-spacing:.18em;
      color:#fff3ad;
      text-shadow:0 0 14px rgba(255,222,120,.18);
    }

    #onlineStatusText{
      white-space:pre-wrap;
      line-height:1.5;
      color:#dbe6ff;
    }

    .pick-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:10px;
    }

    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:18px;
      padding:10px;
      text-align:left;
      cursor:pointer;
      transition:transform .15s ease, border-color .15s ease;
    }
    .card:hover{ transform:translateY(-2px); }
    .card.active{
      border-color:rgba(255,255,255,.38);
      box-shadow:0 0 0 2px rgba(255,255,255,.08) inset;
    }

    .card h3{ margin:0 0 6px; font-size:16px; }
    .card p{ margin:4px 0; font-size:12px; color:var(--muted); }

    .tag{
      display:inline-block;
      margin-right:6px;
      margin-top:6px;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      font-size:10px;
      font-weight:700;
    }

    .box{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      text-align:left;
      margin:10px 0;
    }

    .rank-item{
      display:grid;
      grid-template-columns:56px 1.5fr .8fr .9fr;
      align-items:center;
      gap:8px;
      padding:9px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:13px;
    }
    .rank-item:last-child{ border-bottom:none; }

    #hud{
      position:absolute;
      inset:0;
      display:none;
      z-index:10;
      pointer-events:none;
    }

    .top-ui{
      position:absolute;
      left:0;
      top:var(--hudTop);
      width:100%;
      padding:0 4px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:4px;
    }

    .fighter-panel{
      width:min(28vw,154px);
      background:rgba(0,0,0,.42);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:5px 5px 4px;
      backdrop-filter:blur(8px);
    }

    .fighter-name{
      font-size:8px;
      font-weight:900;
      margin-bottom:4px;
      letter-spacing:.05em;
    }

    .bar-wrap{
      width:100%;
      height:8px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.12);
    }

    .bar{
      width:100%;
      height:100%;
      border-radius:999px;
      transition:width .08s linear;
    }
    .bar.player{ background:linear-gradient(90deg,#ff9c66,#ff4d63); }
    .bar.enemy{ background:linear-gradient(90deg,#72e3ff,#4b7fff); }
    .bar.super{ background:linear-gradient(90deg,#ffe08a,#ffb300); }
    .bar.awaken{ background:linear-gradient(90deg,#77ffd3,#00d99b); }

    .small-info{
      margin-top:3px;
      display:flex;
      justify-content:space-between;
      gap:6px;
      font-size:6px;
      color:var(--muted);
    }

    #centerWrap{
      padding-top:2px;
      min-width:52px;
      text-align:center;
    }

    #centerInfo{
      font-weight:900;
      letter-spacing:.06em;
      text-align:center;
      text-shadow:0 4px 18px rgba(0,0,0,.5);
      font-size:clamp(9px,2vw,13px);
    }

    #message{
      position:absolute;
      left:50%;
      top:calc(var(--hudTop) + 28px);
      transform:translateX(-50%);
      min-width:90px;
      max-width:78vw;
      text-align:center;
      padding:4px 8px;
      border-radius:14px;
      background:rgba(0,0,0,.55);
      border:1px solid var(--line);
      font-size:clamp(10px,3vw,15px);
      font-weight:900;
      opacity:0;
      transition:opacity .2s ease;
      backdrop-filter:blur(8px);
    }
    #message.show{ opacity:1; }

    #topButtons{
      position:absolute;
      top:calc(var(--hudTop) + 1px);
      right:6px;
      display:none;
      gap:6px;
      z-index:20;
      pointer-events:auto;
    }

    .mini-btn{
      min-width:auto;
      width:30px;
      height:30px;
      padding:0;
      border-radius:50%;
      font-size:12px;
      background:linear-gradient(180deg,#5b6885,#2a3246);
    }

    #mobileControls{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:none;
      justify-content:space-between;
      align-items:flex-end;
      padding:
        2px
        max(8px, env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      z-index:18;
      pointer-events:none;
    }

    .pad{
      display:flex;
      gap:var(--mobileGap);
      align-items:flex-end;
      pointer-events:auto;
    }

    .pad.right{ align-items:center; }

    .touch-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:1000;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.16);
      backdrop-filter:blur(8px);
      box-shadow:var(--shadow);
      pointer-events:auto;
      border-radius:20px;
      touch-action:none;
    }

    .touch-btn.move{
      width:var(--moveBtn);
      height:var(--moveBtn);
      font-size:20px;
    }

    .touch-btn.action{
      width:var(--actionBtn);
      height:var(--actionBtn);
      font-size:20px;
    }

    .touch-btn.special{
      width:var(--specialBtn);
      height:var(--specialBtn);
      font-size:23px;
    }

    .touch-btn.active, .touch-btn:active{
      transform:scale(.96);
      background:rgba(255,255,255,.26);
    }

    #rotateNotice{
      position:absolute;
      inset:0;
      display:none;
      z-index:90;
      background:rgba(0,0,0,.92);
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      font-size:clamp(18px,5vw,32px);
      font-weight:900;
      letter-spacing:.05em;
      pointer-events:none;
    }

    #transformOverlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:65;
      pointer-events:none;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.18), rgba(0,0,0,.35) 40%, rgba(0,0,0,0) 70%);
      text-align:center;
    }
    #transformOverlay.show{ display:flex; }

    #transformText{
      font-size:clamp(28px,7vw,70px);
      font-weight:1000;
      letter-spacing:.10em;
      text-shadow:0 0 24px rgba(255,255,255,.38), 0 8px 24px rgba(0,0,0,.55);
      background:linear-gradient(90deg,#fff,#ffe89f,#ffd1d9,#fff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    #cutinOverlay{
      position:absolute;
      inset:0;
      display:none;
      z-index:66;
      pointer-events:none;
      overflow:hidden;
    }
    #cutinOverlay.show{ display:block; }

    .cutin-bg{
      position:absolute;
      inset:0;
      background:
        linear-gradient(115deg, rgba(255,255,255,.10), transparent 25%, transparent 75%, rgba(255,255,255,.10)),
        linear-gradient(180deg, rgba(6,10,20,.18), rgba(0,0,0,.58));
    }

    .cutin-slash{
      position:absolute;
      inset:-20% -30%;
      background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,.26) 48%, transparent 62%);
      transform:skewX(-25deg);
      animation:cutinSlash .75s ease-out forwards;
    }

    @keyframes cutinSlash{
      from{ transform:translateX(-45%) skewX(-25deg); opacity:0; }
      20%{ opacity:1; }
      to{ transform:translateX(28%) skewX(-25deg); opacity:0; }
    }

    .cutin-body{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8vw 6vw;
      gap:20px;
    }

    .cutin-art{
      flex:1;
      min-height:40vh;
      border-radius:28px;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.26), transparent 20%),
        radial-gradient(circle at 65% 65%, rgba(255,255,255,.18), transparent 24%),
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
    }

    .cutin-art::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 35%, var(--cutinColor, rgba(255,120,140,.55)), transparent 22%),
        linear-gradient(180deg, rgba(255,255,255,.10), transparent 45%);
    }

    .cutin-text{
      flex:1;
      text-align:right;
    }

    .cutin-win{
      font-size:clamp(26px,5vw,62px);
      font-weight:1000;
      letter-spacing:.14em;
      color:#fff;
      text-shadow:0 0 24px rgba(255,255,255,.18), 0 8px 20px rgba(0,0,0,.45);
    }

    .cutin-name{
      font-size:clamp(34px,7vw,86px);
      font-weight:1000;
      letter-spacing:.10em;
      margin-top:8px;
      background:linear-gradient(90deg,#fff,#ffe9a0,#ffd3d8);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    @media (max-width: 940px){
      body.game-active #mobileControls{ display:flex; }
      .menu-grid{ grid-template-columns:1fr; }
      .menu-btn-grid{ grid-template-columns:1fr; }
      .mode-showcase{ grid-template-columns:1fr; }
      .pick-grid{ grid-template-columns:1fr; }

      button,select,input{
        min-width:0;
        width:100%;
        padding:10px 12px;
        font-size:14px;
        border-radius:12px;
      }

      .main-btn{ min-height:50px; font-size:14px; }

      .cutin-body{
        flex-direction:column;
        justify-content:center;
      }

      .cutin-text{ text-align:center; }
      .cutin-art{ width:100%; min-height:24vh; }
    }

    @media (max-width:700px){
      :root{
        --gameScale:.50;
        --moveBtn:64px;
        --actionBtn:76px;
        --specialBtn:84px;
        --mobileGap:6px;
      }
      .hero-badges{ display:none; }
      .hero-title{ font-size:clamp(20px,6vw,34px); }
      .hero-sub{ font-size:10px; }
      .mode-showcase{ display:none; }
      .fighter-panel{ width:min(30vw,96px); }
      .fighter-name{ font-size:6.5px; }
      .small-info{ font-size:5px; }
      .bar-wrap{ height:6px; }
      #centerInfo{ font-size:9px; }
      #message{ font-size:9px; top:calc(var(--hudTop) + 24px); }
    }

    @media (max-width:480px){
      :root{
        --gameScale:.43;
        --moveBtn:58px;
        --actionBtn:68px;
        --specialBtn:76px;
        --mobileGap:5px;
      }
      .hero-sub{ display:none; }
      .fighter-panel{ width:min(31vw,82px); }
      .small-info{ font-size:4.5px; }
      #centerWrap{ min-width:42px; }
      .top-ui{ padding:0 2px; gap:2px; }
      #message{ max-width:74vw; }
    }

    @media (max-height: 760px){
      .hero-title{ font-size:clamp(20px,3.8vw,44px); }
      .hero-sub{ font-size:11px; margin-bottom:6px; }
      .menu-kicker{ margin-bottom:6px; }
      .hero-badges{ display:none; }
      .menu-panel{ border-radius:22px; }
    }

    @media (max-height: 620px){
      .screen{ padding-top:8px; }
      .hero-title{ font-size:clamp(18px,3.2vw,34px); }
      .hero-sub{ display:none; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="menuScreen" class="screen show">
    <div class="panel menu-panel">
      <div class="menu-head">
        <div class="menu-kicker">FIGHT GAME v120 GOD COMPLETE FULL FIX</div>
        <div class="hero-badges">
          <div class="hero-badge">CPU</div>
          <div class="hero-badge">MUSOU</div>
          <div class="hero-badge">ONLINE</div>
          <div class="hero-badge">AWAKENING</div>

      hp:100,

      super:0,
      maxSuper:100,
      awaken:0,
      awakened:false,
      atkMul:ch.atk,
      defMul:ch.def,
      superGain:ch.superGain,
      color:ch.color,
      accent:ch.accent,
      hair:ch.hair,
      aura:ch.aura,
      scarf:ch.scarf,
      onGround:true,
      dead:false,

      invuln:0,

  let player = createFighter(selectedCharacter, true);

  function resetBattle(enemyChar = null){
    fitCanvas();

  function resetInput(){

    Object.keys(pressedThisFrame).forEach(k => pressedThisFrame[k] = false);

  function stopGameVisualOnly(){
    gameRunning = false;
    cancelAnimationFrame(animationId);
    animationId = 0;

    hud.style.display = "none";
    topButtons.style.display = "none";
    setGameUiState(false);
    resetInput();
    updateRotateNotice();

  function attackData(type){
    if (type === "punch") return { timer:11, cooldown:12, damage:6, kb:10, superGain:8 };
    if (type === "kick") return { timer:16, cooldown:18, damage:10, kb:15, superGain:11 };
    if (type === "special") return { timer:26, cooldown:34, damage:18, kb:26, superGain:0, cost:50 };
    if (type === "burst") return { timer:36, cooldown:44, damage:28, kb:34, superGain:0, cost:100 };
    if (type === "projectile") return { timer:16, cooldown:18, damage:11, kb:18, superGain:12 };
    return { timer:0, cooldown:0, damage:0, kb:0, superGain:0 };
  }

  function getAttackRect(f){
    let range = 0, height = 0, yOffset = 0;
    if (f.attackType === "punch") { range = 32; height = 22; yOffset = 38; }
    if (f.attackType === "kick") { range = 52; height = 30; yOffset = 66; }
    if (f.attackType === "special") { range = 112; height = 42; yOffset = 22; }
    if (f.attackType === "burst") { range = 138; height = 54; yOffset = 16; }
    if (f.dir === 1) return { x:f.x + f.w - 4, y:f.y + yOffset, w:range, h:height };
    return { x:f.x - range + 4, y:f.y + yOffset, w:range, h:height };
  }

  function attackActiveFrame(type, timer){
    if (type === "punch") return timer >= 5 && timer <= 7;
    if (type === "kick") return timer >= 8 && timer <= 12;
    if (type === "special") return timer >= 10 && timer <= 18;
    if (type === "burst") return timer >= 12 && timer <= 26;
    return false;
  }

  function gainSuper(f, val){
    f.super = clamp(f.super + val * f.superGain, 0, f.maxSuper);
  }

  function spawnImpact(x, y, color, count=8){
    for (let i = 0; i < count; i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*6,
        vy:(Math.random()-0.5)*6 - 1,
        life:18 + Math.random()*12,
        size:2 + Math.random()*3,
        color
      });
    }
  }

  function spawnAuraBurst(x, y, color){
    for (let i = 0; i < 18; i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*9,
        vy:(Math.random()-0.5)*7 - 1,
        life:22 + Math.random()*12,
        size:3 + Math.random()*4,
        color
      });
    }
  }

  function spawnProjectile(owner){
    const spec = owner.characterKey === "phoenix"
      ? { color:"#ffb066", size:17, speed:7.5 }
      : owner.characterKey === "shadow"
        ? { color:"#b39cff", size:15, speed:7.2 }
        : owner.characterKey === "blade"
          ? { color:"#8dd7ff", size:15, speed:7.8 }
          : { color:"#ffd07f", size:16, speed:7.0 };

    projectiles.push({
      owner: owner.isPlayer ? "player" : "enemy",
      x: owner.dir === 1 ? owner.x + owner.w + 6 : owner.x - 6,
      y: owner.y + 44,
      vx: spec.speed * owner.dir,
      r: spec.size,
      damage: attackData("projectile").damage * owner.atkMul,
      kb: attackData("projectile").kb,
      color: spec.color,
      life: 130
    });

    spawnAuraBurst(owner.x + owner.w/2, owner.y + 40, owner.aura);
  }

  function tryStartAttack(f, type){
    if (f.dead || f.hitstun > 0 || transformLock) return false;
    if (f.attackTimer > 0 || f.attackCooldown > 0) return false;
    const data = attackData(type);
    if ((type === "special" || type === "burst") && f.super < data.cost) return false;

    if (type === "special" || type === "burst"){
      f.super = clamp(f.super - data.cost, 0, f.maxSuper);
      spawnAuraBurst(f.x + f.w/2, f.y + 40, f.aura);
    }

    f.attackType = type;
    f.attackTimer = data.timer;
    f.attackCooldown = data.cooldown;
    f.hasHit = false;

    if (f.isPlayer){
      if (type === "special") showMessage(CHARACTERS[f.characterKey].specialName, 500);
      if (type === "burst") showMessage(CHARACTERS[f.characterKey].burstName, 700);
    }
    return true;
  }

  async function triggerAwaken(f){
    if (f.awakened) return;
    f.awakened = true;
    f.speed += 0.4;
    f.atkMul *= 1.12;
    transformLock = true;
    transformText.textContent = f.isPlayer ? "AWAKENING" : "ENEMY AWAKEN";
    transformOverlay.classList.add("show");
    await delay(700);
    transformOverlay.classList.remove("show");
    spawnAuraBurst(f.x + f.w/2, f.y + 36, f.aura);
    transformLock = false;
  }

  function updateAwaken(f){
    const hpRate = f.hp / f.maxHp;
    f.awaken = clamp((1 - hpRate - 0.65) / 0.35, 0, 1);
    if (!f.awakened && hpRate <= 0.35) triggerAwaken(f);
  }

  async function finishMatch(attackerIsPlayer, reasonText){
    if (gameOver) return;
    if (musou.active && attackerIsPlayer) return advanceMusouRound();

    gameOver = true;
    const winner = attackerIsPlayer ? player : enemy;

    showMessage(attackerIsPlayer ? "YOU WIN" : "YOU LOSE", 1200);

    if (gameMode === "online-host" && online.stateRef){
      try{
        await online.stateRef.update({
          result: {
            show: true,
            title: attackerIsPlayer ? "YOU WIN" : "YOU LOSE",
            sub: reasonText
          }
        });
      }catch(err){
        setOnlineStatus("結果同期失敗\n" + explainFirebaseError(err));
      }
    }

    await playVictoryCutin(winner);

    if (gameMode === "musou"){
      saveLocalRanking(musou.score, "musou");
      showResultScreen(attackerIsPlayer ? "MUSOU CLEAR" : "MUSOU END", `${reasonText} / 撃破数 ${musou.wins} / SCORE ${musou.score}`);
      return;
    }

    if ((gameMode === "cpu" || gameMode === "online-host" || gameMode === "online-guest") && attackerIsPlayer && !resultSaved){
      resultSaved = true;
      const score = Math.max(0, Math.floor(player.hp * 100 + roundTimer * 10 + combo * 30));
      saveLocalRanking(score, "battle");
    }

    showResultScreen(attackerIsPlayer ? "YOU WIN" : "YOU LOSE", reasonText);
  }

  function applyDamage(attacker, target, type, overrideDamage = null, overrideKb = null){
    const data = attackData(type);
    const damage = overrideDamage ?? (data.damage * attacker.atkMul / target.defMul);
    const kb = overrideKb ?? data.kb;

    target.hp = clamp(target.hp - damage, 0, target.maxHp);
    target.hurtFlash = 8;
    target.hitstun = (type === "burst" || type === "special") ? 18 : 10;
    target.invuln = (type === "burst" || type === "special") ? 14 : 8;
    target.x += kb * (attacker.dir === 1 ? 1 : -1);
    target.vx = kb * 0.16 * (attacker.dir === 1 ? 1 : -1);
    gainSuper(attacker, data.superGain || 0);
    gainSuper(target, 4);
    attacker.hasHit = true;

    spawnImpact(target.x + target.w/2, target.y + 38, "#ffffff", type === "burst" ? 16 : 8);
    cameraShake = Math.max(cameraShake, type === "burst" ? 12 : type === "special" ? 9 : 4);

    if (attacker.isPlayer){
      const now = performance.now();
      combo = (now - lastHitTime < 1200) ? combo + 1 : 1;
      lastHitTime = now;
      comboText.textContent = "COMBO " + combo;
    }

    if (target.hp <= 0){
      target.dead = true;
      finishMatch(attacker.isPlayer, "KO");
    }
  }

  function resolveAttackHit(attacker, target){
    if (!attacker.attackType || attacker.hasHit) return;
    if (!attackActiveFrame(attacker.attackType, attacker.attackTimer)) return;
    if (target.invuln > 0) return;
    const atk = getAttackRect(attacker);
    const body = { x:target.x, y:target.y, w:target.w, h:target.h };
    if (rectsOverlap(atk, body)) applyDamage(attacker, target, attacker.attackType);
  }

  function resolveProjectiles(){
    projectiles.forEach(p => {
      p.x += p.vx;
      p.life--;

      const target = p.owner === "player" ? enemy : player;
      const pseudo = p.owner === "player" ? player : enemy;
      const rect = { x:p.x - p.r/2, y:p.y - p.r/2, w:p.r, h:p.r };
      const body = { x:target.x, y:target.y, w:target.w, h:target.h };
      if (target.invuln <= 0 && rectsOverlap(rect, body)){
        applyDamage(pseudo, target, "projectile", p.damage / target.defMul, p.kb);
        p.life = 0;
      }
      if (p.x < -40 || p.x > canvas.width + 40) p.life = 0;
    });
    projectiles = projectiles.filter(p => p.life > 0);
  }

  function updateParticles(){
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= 1;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function updateCommonState(f, dt, opponent){
    if (f.dead) return;
    facingUpdate(f, opponent);
    updateAwaken(f);
    f.animPhase += dt * 0.006;
    if (Math.abs(f.vx) > 0.5 && f.onGround) f.runPhase += dt * 0.018;
    if (f.invuln > 0) f.invuln--;
    if (f.hitstun > 0) f.hitstun--;
    if (f.attackCooldown > 0) f.attackCooldown--;
    if (f.hurtFlash > 0) f.hurtFlash--;

    if (f.attackTimer > 0){
      f.attackTimer--;
      if (f.attackTimer === 0){
        f.attackType = "";
        f.hasHit = false;
      }
    }
  }

  function updateFighterByInput(f, input, dt, opponent){
    updateCommonState(f, dt, opponent);
    if (f.dead) return;

    const spd = f.speed + (f.awakened ? 0.35 : 0);

    if (f.hitstun <= 0 && f.attackTimer <= 0 && !transformLock){
      if (input.left && !input.right) f.vx = -spd;
      else if (input.right && !input.left) f.vx = spd;
      else f.vx *= 0.72;

      if (input.jump && f.onGround){
        f.vy = -(f.jumpPower + (f.awakened ? 0.5 : 0));
        f.onGround = false;
      }

      if (input.punch) tryStartAttack(f, "punch");
      if (input.kick) tryStartAttack(f, "kick");
      if (input.special){
        if (f.super >= 100) tryStartAttack(f, "burst");
        else if (f.super >= 50) tryStartAttack(f, "special");
        else spawnProjectile(f);
      }
    } else if (f.hitstun > 0){
      f.vx *= 0.9;
    }

    f.vy += gravity;
    f.x += f.vx;
    f.y += f.vy;

    if (f.y >= groundY() - f.h){
      f.y = groundY() - f.h;
      f.vy = 0;
      f.onGround = true;
    } else {
      f.onGround = false;
    }

    f.x = clamp(f.x, 16, canvas.width - f.w - 16);
  }

  function updatePlayerOffline(dt){
    updateFighterByInput(player, {
      left:keys.left,
      right:keys.right,
      jump:keys.jump,
      punch:pressedThisFrame.punch,
      kick:pressedThisFrame.kick,
      special:pressedThisFrame.special
    }, dt, enemy);
  }

  function updateEnemyAI(dt){
    updateCommonState(enemy, dt, player);
    if (enemy.dead) return;

    if (enemy.hitstun <= 0 && enemy.attackTimer <= 0 && !transformLock){
      const d = Math.abs((enemy.x + enemy.w/2) - (player.x + player.w/2));
      const diff = difficultySelect.value;
      const baseSpeed = diff === "boss" ? 5.8 : diff === "god" ? 5.15 : diff === "hard" ? 4.45 : 3.9;

      if (d > 150) enemy.vx = enemy.dir === 1 ? baseSpeed : -baseSpeed;
      else if (d < 72) enemy.vx = enemy.dir === 1 ? -baseSpeed * 0.9 : baseSpeed * 0.9;
      else enemy.vx *= 0.6;

      if (enemy.onGround && Math.random() < 0.004 && d > 100 && d < 240){
        enemy.vy = -enemy.jumpPower * 0.95;
        enemy.onGround = false;
      }

      const react = diff === "boss" ? 1.0 : diff === "god" ? 0.93 : diff === "hard" ? 0.80 : 0.62;
      if (enemy.super >= 100 && d < 160 && Math.random() < 0.010 * react) tryStartAttack(enemy, "burst");
      else if (enemy.super >= 50 && d < 150 && Math.random() < 0.016 * react) tryStartAttack(enemy, "special");
      else if (d > 120 && d < 240 && Math.random() < 0.018 * react) spawnProjectile(enemy);
      else if (d < 82 && Math.random() < 0.030 * react) tryStartAttack(enemy, "punch");
      else if (d < 112 && Math.random() < 0.024 * react) tryStartAttack(enemy, "kick");
    } else if (enemy.hitstun > 0){
      enemy.vx *= 0.9;
    }

    enemy.vy += gravity;
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;

    if (enemy.y >= groundY() - enemy.h){
      enemy.y = groundY() - enemy.h;
      enemy.vy = 0;
      enemy.onGround = true;
    } else enemy.onGround = false;

    enemy.x = clamp(enemy.x, 16, canvas.width - enemy.w - 16);
  }

  function resolvePush(){
    const a = { x:player.x, y:player.y, w:player.w, h:player.h };
    const b = { x:enemy.x, y:enemy.y, w:enemy.w, h:enemy.h };
    if (!rectsOverlap(a,b)) return;
    const centerA = a.x + a.w / 2;
    const centerB = b.x + b.w / 2;
    const overlap = (a.w / 2 + b.w / 2) - Math.abs(centerA - centerB);
    if (overlap > 0){
      const dir = centerA < centerB ? -1 : 1;
      player.x += dir * overlap / 2;
      enemy.x -= dir * overlap / 2;
      player.x = clamp(player.x, 16, canvas.width - player.w - 16);
      enemy.x = clamp(enemy.x, 16, canvas.width - enemy.w - 16);
    }
  }

  async function playVictoryCutin(fighter){
    if (cutinPlaying) return;
    cutinPlaying = true;
    cutinName.textContent = fighter.name;
    cutinArt.style.setProperty("--cutinColor", fighter.aura);
    cutinOverlay.classList.add("show");
    await delay(1100);
    cutinOverlay.classList.remove("show");
    cutinPlaying = false;
  }

  async function advanceMusouRound(){
    musou.wins += 1;
    const gain = Math.floor(400 + musou.wins * 120 + player.hp * 8);
    musou.score += gain;
    musou.wave += 1;
    enemy = createFighter(pickEnemyCharacter(), false);
    enemy.maxHp = Math.min(150, 100 + musou.wins * 7);
    enemy.hp = enemy.maxHp;
    enemy.atkMul *= 1 + musou.wins * 0.03;
    enemy.defMul *= 1 + musou.wins * 0.02;
    player.x = 120;
    player.y = groundY() - player.h;
    player.vx = 0;
    player.vy = 0;
    player.dead = false;
    player.hitstun = 0;
    player.invuln = 30;
    player.super = clamp(player.super + 22, 0, 100);
    roundTimer = 60;
    combo = 0;
    comboText.textContent = "COMBO 0";
    difficultyText.textContent = `MUSOU W${musou.wave}`;
    rightName.textContent = enemy.name;
    showMessage(`WAVE ${musou.wave} +${gain}`, 1000);
  }

  function exportFighter(f){
    const playableW = Math.max(1, canvas.width - 32 - f.w);
    const playableH = Math.max(1, groundY() - f.h);

    return {
      characterKey: f.characterKey,
      name: f.name,
      px: (f.x - 16) / playableW,
      py: playableH > 0 ? (f.y / playableH) : 0,
      vxRate: canvas.width ? (f.vx / canvas.width) : 0,
      vyRate: canvas.height ? (f.vy / canvas.height) : 0,
      dir: f.dir,
      speed: f.speed,
      jumpPower: f.jumpPower,
      hp: f.hp,
      maxHp: f.maxHp,
      super: f.super,
      maxSuper: f.maxSuper,
      awaken: f.awaken,
      awakened: f.awakened,
      atkMul: f.atkMul,
      defMul: f.defMul,
      superGain: f.superGain,
      color: f.color,
      accent: f.accent,
      hair: f.hair,
      aura: f.aura,
      scarf: f.scarf,
      onGround: f.onGround,
      dead: f.dead,
      attackType: f.attackType,
      attackTimer: f.attackTimer,
      attackCooldown: f.attackCooldown,
      hitstun: f.hitstun,
      invuln: f.invuln,
      hurtFlash: f.hurtFlash,
      hasHit: f.hasHit,
      isPlayer: f.isPlayer,
      animPhase: f.animPhase,
      runPhase: f.runPhase
    };
  }

  function importFighter(target, src){
    if (!src) return;

    const localW = target.w;
    const localH = target.h;

    target.characterKey = src.characterKey;
    target.name = src.name;

    const playableW = Math.max(1, canvas.width - localW - 32);
    const playableH = Math.max(1, groundY() - localH);

    target.x = 16 + clamp((src.px ?? 0) * playableW, 0, playableW);
    target.y = clamp((src.py ?? 0) * playableH, 0, playableH);

    target.vx = src.vxRate != null ? src.vxRate * canvas.width : 0;
    target.vy = src.vyRate != null ? src.vyRate * canvas.height : 0;

    target.dir = src.dir;
    target.speed = src.speed;
    target.jumpPower = src.jumpPower;
    target.hp = src.hp;
    target.maxHp = src.maxHp;
    target.super = src.super;
    target.maxSuper = src.maxSuper;
    target.awaken = src.awaken;
    target.awakened = src.awakened;
    target.atkMul = src.atkMul;
    target.defMul = src.defMul;
    target.superGain = src.superGain;
    target.color = src.color;
    target.accent = src.accent;
    target.hair = src.hair;
    target.aura = src.aura;
    target.scarf = src.scarf;
    target.onGround = src.onGround;
    target.dead = src.dead;
    target.attackType = src.attackType;
    target.attackTimer = src.attackTimer;
    target.attackCooldown = src.attackCooldown;
    target.hitstun = src.hitstun;
    target.invuln = src.invuln;
    target.hurtFlash = src.hurtFlash;
    target.hasHit = src.hasHit;
    target.isPlayer = src.isPlayer;
    target.animPhase = src.animPhase;
    target.runPhase = src.runPhase;

    target.w = localW;
    target.h = localH;

    target.x = clamp(target.x, 16, canvas.width - target.w - 16);
    target.y = clamp(target.y, 0, groundY() - target.h);
  }

  function getOnlineInput(){
    return {
      left: !!keys.left,
      right: !!keys.right,
      jump: !!keys.jump,
      punch: !!pressedThisFrame.punch,
      kick: !!pressedThisFrame.kick,
      special: !!pressedThisFrame.special,
      holdPunch: !!keys.punch,
      holdKick: !!keys.kick,
      holdSpecial: !!keys.special,
      ts: Date.now()
    };

  function onlineCleanupRefs(){
    try { if (online.stateRef) online.stateRef.off(); } catch(e){}
    try { if (online.localInputRef) online.localInputRef.off(); } catch(e){}
    try { if (online.remoteInputRef) online.remoteInputRef.off(); } catch(e){}
    try { if (online.metaRef) online.metaRef.off(); } catch(e){}
    online.roomRef = null;
    online.stateRef = null;
    online.localInputRef = null;
    online.remoteInputRef = null;
    online.metaRef = null;
    online.remoteInput = {};
    online.code = "";
    online.role = "";
    online.localName = "PLAYER";
    online.remoteName = "GUEST";
  }

  async function onlineLeave(removeRoom = false){
    try{
      if (online.roomRef){
        if (online.role === "host"){
          if (removeRoom) await online.roomRef.remove();
          else await online.roomRef.child("meta").update({ status:"closed" });
        } else if (online.role === "guest"){
          await online.roomRef.child("guestInput").remove().catch(()=>{});
          await online.roomRef.child("meta").update({
            guestName:null,
            guestChar:null,
            status:"waiting"
          }).catch(()=>{});
        }
      }
    }catch(e){}
    onlineCleanupRefs();
    setOnlineStatus("未接続");
    setRoomCodeDisplay("");
  }

  function randomRoomCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for(let i=0;i<6;i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  async function createOnlineRoom(){
    saveNameLocal();

    if (!firebaseReady()){
      setOnlineStatus("Firebase初期化失敗\nfirebaseの読込に失敗しています");
      return;
    }

    await onlineLeave(false);

    const code = randomRoomCode();
    const name = getPlayerName();
    const stage = stageSelect.value;

    roomCodeInput.value = code;
    setRoomCodeDisplay(code);

        },

        }
      });

    online.metaRef.on("value", async snap => {

        setOnlineStatus(`対戦開始\nコード: ${code}`);
      }
    });

    online.remoteInputRef.on("value", snap => {
      online.remoteInput = snap.val() || {};
    });
  }

  async function joinOnlineRoom(){
    saveNameLocal();

    if (!firebaseReady()){
      setOnlineStatus("Firebase初期化失敗\nfirebaseの読込に失敗しています");
      return;
    }

    await onlineLeave(false);

    const code = (roomCodeInput.value || "").trim().toUpperCase();
    if (!code){
      setOnlineStatus("ルームコードを入力してください");
      return;
    }

    setRoomCodeDisplay(code);
    setOnlineStatus("ルーム確認中...");

    const roomRef = db.ref("fight_v120_rooms_fix/" + code);
    let metaSnap;
    try{
      metaSnap = await roomRef.child("meta").get();
    }catch(err){
      console.error(err);
      setOnlineStatus("ルーム確認失敗\n" + explainFirebaseError(err));
      return;
    }

    if (!metaSnap.exists()){
      setOnlineStatus("そのルームはありません");
      return;
    }

    const meta = metaSnap.val();
    if (meta.status === "ready"){
      setOnlineStatus("そのルームは使用中です");
      return;
    }

    const name = getPlayerName();

    try{
      await roomRef.child("meta").update({
        guestName:name,
        guestChar:selectedCharacter,
        status:"ready"
      });
    }catch(err){
      console.error(err);
      setOnlineStatus("参加失敗\n" + explainFirebaseError(err));
      return;
    }

    online.code = code;
    online.role = "guest";
    online.localName = name;
    online.remoteName = meta.hostName || "HOST";
    online.roomRef = roomRef;
    online.stateRef = roomRef.child("state");
    online.localInputRef = roomRef.child("guestInput");
    online.remoteInputRef = roomRef.child("hostInput");
    online.metaRef = roomRef.child("meta");

    gameMode = "online-guest";
    musou.active = false;
    gameOver = false;

    await enterFullscreenIfPossible();

    stageSelect.value = meta.stage || stageSelect.value;
    resetBattle(meta.hostChar || pickEnemyCharacter());

    leftName.textContent = meta.hostName || "HOST";
    rightName.textContent = name;
    difficultyText.textContent = `ONLINE / ${STAGES[stageSelect.value].label}`;

    clearScreens();
    canvas.style.display = "block";
    hud.style.display = "block";
    topButtons.style.display = "flex";
    setGameUiState(true);
    gameRunning = true;

    online.stateRef.on("value", snap => {
      const s = snap.val();
      if (!s) return;

      fitCanvas();

      if (s.result && s.result.show) {
        if (!gameOver) {
          gameOver = true;

          let title = s.result.title || "RESULT";
          const sub = s.result.sub || "試合終了";

          if (gameMode === "online-guest") {
            if (title === "YOU WIN") title = "YOU LOSE";
            else if (title === "YOU LOSE") title = "YOU WIN";
          }

          showResultScreen(title, sub);
        }
        return;
      }

      if (s.roundTimer != null) roundTimer = s.roundTimer;
      if (s.combo != null) combo = s.combo;
      if (s.centerInfo) centerInfo.textContent = s.centerInfo;
      if (s.leftName) leftName.textContent = s.leftName;
      if (s.rightName) rightName.textContent = s.rightName;
      if (s.player) importFighter(player, s.player);
      if (s.enemy) importFighter(enemy, s.enemy);
    });

    online.remoteInputRef.on("value", snap => {
      online.remoteInput = snap.val() || {};
    });

    lastTime = performance.now();
    animationId = requestAnimationFrame(loop);
    updateRotateNotice();
    setOnlineStatus(`参加成功\nコード: ${code}`);
  }

      if (online.stateRef){

  function updateGame(dt){
    if (gameOver) return;

    if (gameMode === "online-guest"){
      const inputPayload = {
        left: !!keys.left,
        right: !!keys.right,
        jump: !!keys.jump,
        punch: !!pressedThisFrame.punch,
        kick: !!pressedThisFrame.kick,
        special: !!pressedThisFrame.special,
        holdPunch: !!keys.punch,
        holdKick: !!keys.kick,
        holdSpecial: !!keys.special,
        ts: Date.now()
      };

      if (online.localInputRef) {
        online.localInputRef.set(inputPayload).catch(err => {
          setOnlineStatus("送信失敗\n" + explainFirebaseError(err));
        });
      }

      Object.keys(pressedThisFrame).forEach(k => pressedThisFrame[k] = false);
      return;
    }

    roundTimer -= dt / 1000;
    if (roundTimer < 0) roundTimer = 0;

    centerInfo.textContent = gameMode.startsWith("online")
      ? `ONLINE / ${Math.ceil(roundTimer)}`
      : musou.active
        ? `W${musou.wave} / ${Math.ceil(roundTimer)} / ${musou.score}`
        : `${STAGES[stageSelect.value].label} / ${Math.ceil(roundTimer)}`;

    updatePlayerOffline(dt);

    if (gameMode === "online-host"){
      updateFighterByInput(enemy, {
        left: !!online.remoteInput.left,
        right: !!online.remoteInput.right,
        jump: !!online.remoteInput.jump,
        punch: !!online.remoteInput.punch || !!online.remoteInput.holdPunch,
        kick: !!online.remoteInput.kick || !!online.remoteInput.holdKick,
        special: !!online.remoteInput.special || !!online.remoteInput.holdSpecial
      }, dt, player);
    } else {
      updateEnemyAI(dt);
    }

    resolvePush();
    resolveAttackHit(player, enemy);
    resolveAttackHit(enemy, player);
    resolveProjectiles();
    updateParticles();

    if (performance.now() - lastHitTime > 1300 && combo !== 0){
      combo = 0;
      comboText.textContent = "COMBO 0";
    }

    if (!gameOver && roundTimer <= 0){
      if (musou.active){
        finishMatch(false, "TIME UP");
      } else {
        if (player.hp >= enemy.hp) finishMatch(true, "TIME UP");
        else finishMatch(false, "TIME UP");
      }
    }

    if (gameMode === "online-host" && online.stateRef){
      online.stateRef.set({
        roundTimer,
        combo,
        centerInfo:centerInfo.textContent,
        leftName:leftName.textContent,
        rightName:rightName.textContent,
        player:exportFighter(player),
        enemy:exportFighter(enemy),
        result: null
      }).catch(err => {
        setOnlineStatus("状態同期失敗\n" + explainFirebaseError(err));
      });

      if (online.localInputRef) {
        online.localInputRef.set(getOnlineInput()).catch(err => {
          setOnlineStatus("入力同期失敗\n" + explainFirebaseError(err));
        });
      }
    }

    Object.keys(pressedThisFrame).forEach(k => pressedThisFrame[k] = false);
  }

  function loop(now){
    const dt = Math.min(32, now - lastTime);
    lastTime = now;
    if (!gameRunning) return;
    updateGame(dt);
    render();
    animationId = requestAnimationFrame(loop);
  }

  function drawBackground(){
    const st = STAGES[stageSelect.value];
    const horizon = canvas.height * 0.56;
    const grad = ctx.createLinearGradient(0, 0, 0, horizon);
    grad.addColorStop(0, st.skyTop);
    grad.addColorStop(1, st.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, horizon);

    if (stageSelect.value === "neon"){
      for (let i = 0; i < 12; i++){
        ctx.fillStyle = i % 2 ? "rgba(116,196,255,.12)" : "rgba(255,90,180,.08)";
        ctx.fillRect(i * (canvas.width/12), 42 + (i%3)*14, 44, horizon - 100 - (i%4)*18);
      }
    } else if (stageSelect.value === "moon"){
      ctx.fillStyle = "rgba(255,255,255,.14)";
      ctx.beginPath();
      ctx.arc(canvas.width * 0.82, 92, 42, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.04)";
      for (let i = 0; i < 8; i++){
        const bw = 84 + (i % 3) * 44;
        const bh = 90 + (i % 4) * 24;
        const bx = i * (canvas.width / 8);
        const by = horizon - bh;
        ctx.fillRect(bx, by, bw, bh);
      }
    }

    ctx.fillStyle = st.floor;
    ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);
    ctx.fillStyle = st.line;
    for (let i = 0; i < canvas.width; i += 76) ctx.fillRect(i, horizon + 28, 44, 3);
  }

  function drawAura(f, x, y){
    const active = f.super >= 50 || f.awakened;
    if (!active) return;
    const pulse = 0.65 + Math.sin(performance.now() * 0.01 + f.animPhase) * 0.08;
    ctx.save();
    ctx.globalAlpha = f.awakened ? 0.24 : 0.14;
    ctx.fillStyle = f.aura;
    ctx.beginPath();
    ctx.ellipse(x + f.w/2, y + f.h/2, (f.awakened ? 36 : 28) * pulse, (f.awakened ? 66 : 54) * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFighter(f){
    const x = Math.round(f.x);
    const y = Math.round(f.y);
    const t = performance.now() * 0.01 + f.animPhase;
    const breathe = Math.sin(t) * 1.4;
    const runSwing = Math.sin(f.runPhase) * 10;
    const runSwing2 = Math.sin(f.runPhase + Math.PI) * 10;
    const moving = Math.abs(f.vx) > 0.5 && f.onGround;

    ctx.save();
    drawAura(f, x, y);
    if (f.hurtFlash > 0) ctx.globalAlpha = 0.82;

    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(x + f.w / 2, groundY() - 3, 24, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    const bodyX = x + 10;
    const bodyY = y + 18 + breathe;
    const bodyW = f.w - 20;
    const bodyH = f.h - 36;

    ctx.fillStyle = f.scarf;
    ctx.globalAlpha = 0.28;
    ctx.beginPath();
    ctx.moveTo(bodyX + bodyW/2, bodyY + 22);
    ctx.quadraticCurveTo(bodyX + bodyW/2 - 16 * f.dir, bodyY + 38, bodyX + bodyW/2 - 6 * f.dir, bodyY + 58 + runSwing * 0.15);
    ctx.lineTo(bodyX + bodyW/2 + 11 * f.dir, bodyY + 30);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = f.hurtFlash > 0 ? "#ffffff" : f.color;
    ctx.strokeStyle = f.accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(bodyX, bodyY, bodyW, bodyH, 14);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,.18)";
    ctx.fillRect(bodyX + 8, bodyY + 28, bodyW - 16, 7);
    ctx.fillStyle = "rgba(0,0,0,.16)";
    ctx.fillRect(bodyX + 8, bodyY + 58, bodyW - 16, 9);

    ctx.fillStyle = f.hurtFlash > 0 ? "#ffffff" : f.color;
    ctx.beginPath();
    ctx.arc(x + f.w/2, y + 14 + breathe, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = f.hair;
    ctx.beginPath();
    ctx.ellipse(x + f.w/2, y + 9 + breathe, 15, 8, 0, Math.PI, 0, true);
    ctx.fill();

    ctx.fillStyle = "#101624";
    ctx.fillRect(x + f.w/2 - 6, y + 14 + breathe, 4, 2);
    ctx.fillRect(x + f.w/2 + 2, y + 14 + breathe, 4, 2);

    const cx = x + f.w/2;
    const armY = y + 44 + breathe;
    const legY = y + f.h - 24;
    const footY = y + f.h - 2;
    const forward = f.dir === 1 ? 1 : -1;
    const backArmOffset = moving ? runSwing2 * 0.45 : 6;
    const frontArmOffset = moving ? runSwing * 0.45 : 8;
    const frontLegOffset = moving ? runSwing : 0;
    const backLegOffset = moving ? runSwing2 : 0;

    ctx.strokeStyle = f.accent;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(cx, armY);
    if (f.attackTimer > 0){
      const len = f.attackType === "punch" ? 34 :
        f.attackType === "kick" ? 18 :
        f.attackType === "burst" ? 60 : 54;
      const rise = f.attackType === "special" ? -10 : f.attackType === "burst" ? -18 : -2;
      ctx.lineTo(cx + len * forward, armY + rise);
    } else {
      ctx.lineTo(cx + (14 + frontArmOffset) * forward, armY + 11);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, armY);
    ctx.lineTo(cx - (14 + backArmOffset) * forward, armY + 11);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, legY);
    if (f.attackTimer > 0 && f.attackType === "kick") ctx.lineTo(cx + 42 * forward, legY + 4);
    else ctx.lineTo(cx + 10 + frontLegOffset * 0.35, footY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, legY);
    ctx.lineTo(cx - 10 + backLegOffset * 0.35, footY);
    ctx.stroke();

    if (f.attackTimer > 0){
      const atk = getAttackRect(f);
      if (["special","burst"].includes(f.attackType)){
        ctx.fillStyle = f.attackType === "burst" ? "rgba(255,255,255,.18)" : "rgba(255,210,77,.22)";
        ctx.strokeStyle = f.attackType === "burst" ? "rgba(255,255,255,.92)" : "rgba(255,230,166,.82)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(atk.x, atk.y, atk.w, atk.h, 18);
        ctx.fill();
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawProjectiles(){
    projectiles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 0.8, p.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.restore();
    });
  }

  function drawParticles(){
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 32);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawHud(){
    playerHpBar.style.width = ((player.hp / player.maxHp) * 100) + "%";
    enemyHpBar.style.width = ((enemy.hp / enemy.maxHp) * 100) + "%";
    playerSuperBar.style.width = ((player.super / player.maxSuper) * 100) + "%";
    enemySuperBar.style.width = ((enemy.super / enemy.maxSuper) * 100) + "%";
    playerAwakenBar.style.width = (player.awaken * 100) + "%";
    enemyAwakenBar.style.width = (enemy.awaken * 100) + "%";
    playerHpText.textContent = `HP ${Math.ceil(player.hp)} / ${player.maxHp}`;
    enemyHpText.textContent = musou.active ? `S ${musou.score}` : `HP ${Math.ceil(enemy.hp)} / ${enemy.maxHp}`;
  }

  function render(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const shakeX = cameraShake > 0 ? (Math.random() - 0.5) * cameraShake : 0;
    const shakeY = cameraShake > 0 ? (Math.random() - 0.5) * cameraShake : 0;
    const scale = parseFloat(getComputedStyle(root).getPropertyValue("--gameScale")) || 1;

    ctx.save();
    ctx.translate(shakeX, shakeY);

    if (scale !== 1){
      const topMargin = 8;
      ctx.translate((canvas.width - canvas.width * scale) / 2, topMargin);
      ctx.scale(scale, scale);
    }

    drawBackground();
    drawFighter(player);
    drawFighter(enemy);
    drawProjectiles();
    drawParticles();
    ctx.restore();

    if (cameraShake > 0) cameraShake *= 0.82;
    if (cameraShake < 0.3) cameraShake = 0;
    drawHud();
  }

  function setKeyFromCode(code, pressed){
    if (code === "ArrowLeft") keys.left = pressed;
    if (code === "ArrowRight") keys.right = pressed;
    if (code === "ArrowUp") keys.jump = pressed;
    if (code === "KeyZ"){
      if (pressed) pressedThisFrame.punch = true;
      keys.punch = pressed;
    }
    if (code === "KeyX"){
      if (pressed) pressedThisFrame.kick = true;
      keys.kick = pressed;
    }
    if (code === "KeyC"){
      if (pressed) pressedThisFrame.special = true;
      keys.special = pressed;
    }
  }

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft","ArrowRight","ArrowUp","KeyZ","KeyX","KeyC","Space"].includes(e.code)) e.preventDefault();
    setKeyFromCode(e.code, true);
  }, { passive:false });

  window.addEventListener("keyup", (e) => setKeyFromCode(e.code, false));

  function bindTouchButton(el, keyName){
    const press = (e) => {
      if (e) e.preventDefault();
      keys[keyName] = true;
      if (keyName === "punch") pressedThisFrame.punch = true;
      if (keyName === "kick") pressedThisFrame.kick = true;
      if (keyName === "special") pressedThisFrame.special = true;
      el.classList.add("active");
    };

    const release = (e) => {
      if (e) e.preventDefault();
      keys[keyName] = false;
      el.classList.remove("active");
    };

    el.addEventListener("pointerdown", press, { passive:false });
    el.addEventListener("pointerup", release, { passive:false });
    el.addEventListener("pointercancel", release, { passive:false });
    el.addEventListener("pointerleave", release, { passive:false });

    el.addEventListener("touchstart", press, { passive:false });
    el.addEventListener("touchend", release, { passive:false });
    el.addEventListener("touchcancel", release, { passive:false });

    el.addEventListener("mousedown", press, { passive:false });
    el.addEventListener("mouseup", release, { passive:false });
    el.addEventListener("mouseleave", release, { passive:false });
  }

  bindTouchButton(touchButtons.left, "left");
  bindTouchButton(touchButtons.right, "right");
  bindTouchButton(touchButtons.jump, "jump");
  bindTouchButton(touchButtons.punch, "punch");

  resultMenuBtn.onclick = returnToMenu;
  fullscreenBtn.onclick = enterFullscreenIfPossible;
  gameFullscreenBtn.onclick = enterFullscreenIfPossible;
  backMenuBtn.onclick = returnToMenu;
  createRoomBtn.onclick = createOnlineRoom;
  joinRoomBtn.onclick = joinOnlineRoom;

  playerNameInput.addEventListener("change", saveNameLocal);
  playerNameInput.addEventListener("blur", saveNameLocal);

  fitCanvas();
  applyViewportSafeLayout();
  renderCharacterCards();
  renderMenuCommands();
  setHelpText();
  loadNameLocal();
  setRoomCodeDisplay("");
  setOnlineStatus(db ? "未接続" : "Firebase初期化失敗");

  window.addEventListener("resize", () => {
    fitCanvas();
    applyViewportSafeLayout();
    setGameUiState(gameRunning);
    updateRotateNotice();
  });

  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      fitCanvas();
      applyViewportSafeLayout();
      setGameUiState(gameRunning);
      updateRotateNotice();
    }, 250);
  });

  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", () => {
      fitCanvas();
      applyViewportSafeLayout();
      setGameUiState(gameRunning);
      updateRotateNotice();
    });
    window.visualViewport.addEventListener("scroll", () => {
      applyViewportSafeLayout();
      updateRotateNotice();
    });
  }

  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  document.addEventListener("touchstart", (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });

  document.addEventListener("touchmove", (e) => {
    if (e.scale && e.scale !== 1) e.preventDefault();
    if (gameRunning && e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });

  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive:false });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("selectstart", (e) => e.preventDefault());
  document.addEventListener("dragstart", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive:false });
  document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive:false });
  document.addEventListener("gestureend", (e) => e.preventDefault(), { passive:false });

  clearScreens();
  menuScreen.classList.add("show");
  setGameUiState(false);
})();
</script>
</body>
</html>
